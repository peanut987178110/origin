<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0b16">
<title>Orbit</title>
<style>
:root{
  --bg:#0a0b16; --bg2:#11132a; --card:#161935; --card2:#1d2145; --line:rgba(255,255,255,.09);
  --txt:#eceefa; --dim:#9aa0c3; --faint:#6b7199; --acc:#a78bfa; --acc2:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --r:18px; --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(700px 480px at 85% -10%,rgba(167,139,250,.16),transparent 65%),
  radial-gradient(600px 420px at -10% 110%,rgba(96,165,250,.12),transparent 60%),var(--bg)}
/* screens: only the active one is displayed; entering screen fades/slides 150 ms (transform only) */
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex;animation:in .15s ease-out}
.scr.on.back{animation:inb .15s ease-out}
@keyframes in{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:.4;transform:translateX(-18px)}to{opacity:1;transform:none}}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px calc(24px + var(--safe-b))}
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(10,11,22,.86)}
.top h2{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:17px;font-weight:650}
.top .pill{margin-left:auto} /* a long title on a phone-width bar drops the pill to a second line instead of clipping it */
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card);border:1px solid var(--line)}
.ib:active,.btn:active,.opt:active,.chip:active,.row.tap:active{transform:scale(.97);opacity:.85}
h1{font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:14px;margin-top:8px}
.tiny{font-size:12px;color:var(--faint)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:600;font-size:15px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0b18;transition:transform .08s}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px;width:auto}
.btn.danger{background:rgba(248,113,113,.14);color:#fca5a5;border:1px solid rgba(248,113,113,.3)}
.btn[disabled]{opacity:.4;pointer-events:none}
.stack>*+*{margin-top:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);transition:transform .08s}
.opt.on{border-color:var(--acc);background:var(--card2)}
.opt .t{font-weight:600}.opt .d{font-size:13px;color:var(--dim);margin-top:2px}
.orb{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;
  background:radial-gradient(circle at 30% 30%,var(--c1,#a78bfa),var(--c2,#60a5fa));box-shadow:0 0 24px -6px var(--c1,#a78bfa)}
.orb.big{width:88px;height:88px;font-size:42px}.orb.s{width:32px;height:32px;font-size:16px;box-shadow:none}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}.row .grow{flex:1;min-width:0}.row .k{font-weight:550}.row .v{color:var(--dim);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:8px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px}
.seg button.on{background:var(--acc);color:#0b0b18;border-color:transparent;font-weight:600}
.sw{width:46px;height:28px;border-radius:99px;background:#2a2f55;position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
input.f,textarea.f{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13.5px}
.chip.x::after{content:' ×';color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;background:var(--bg2);border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
.bar{height:6px;border-radius:9px;background:#252a52;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
/* bottom tabs */
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:rgba(10,11,22,.94);padding-bottom:var(--safe-b)}
.tabs button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:19px;font-weight:400}.tabs button.on{color:var(--txt)}
/* chat */
#msgs{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.m{display:flex;gap:8px;max-width:100%}.m.me{flex-direction:row-reverse}
.bub{max-width:82%;padding:10px 13px;border-radius:18px;background:var(--card2);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.m.me .bub{background:linear-gradient(135deg,rgba(167,139,250,.32),rgba(96,165,250,.26));border-color:rgba(167,139,250,.35);border-bottom-right-radius:6px}
.m.ai .bub{border-bottom-left-radius:6px}
.bub.crisis{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.08)}
.bub.pro{border-style:dashed}
.bub .cur{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--dim);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.meta{display:flex;gap:4px;margin:4px 0 0 40px;flex-wrap:wrap}
.meta button{font-size:12px;color:var(--faint);padding:3px 7px;border-radius:8px}
.meta button.on{color:var(--acc)}
.sysl{align-self:center;font-size:12px;color:var(--faint);padding:2px 10px;text-align:center}
.mc{align-self:stretch;margin-left:40px;background:var(--card);border:1px solid rgba(167,139,250,.35);border-radius:16px;padding:12px}
.mc .q{font-size:14px}.mc .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qr{flex:none;display:flex;gap:8px;overflow-x:auto;padding:4px 12px 6px}.qr .chip{white-space:nowrap}
.inp{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + var(--safe-b));border-top:1px solid var(--line);background:rgba(10,11,22,.94)}
.inp textarea{flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 14px;border-radius:21px;background:var(--bg2);border:1px solid var(--line);outline:none;line-height:1.45}
.send{width:42px;height:42px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0b18}
.send.stop{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.ib.rec{background:rgba(248,113,113,.2);border-color:var(--bad)}
.ready{flex:none;font-size:12px;color:var(--dim);padding:6px 14px;background:rgba(167,139,250,.08);border-bottom:1px solid var(--line);display:none}
.ready.on{display:block}
/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:50;display:none}.sheet.on{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:18px 18px calc(18px + var(--safe-b));animation:up .16s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);z-index:60;background:#262b55;border:1px solid var(--line);
  padding:9px 14px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .15s;max-width:86%;text-align:center}
#toast.on{opacity:1}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi .card{padding:11px}.kpi .n{font-size:20px;font-weight:700}.kpi .l{font-size:12px;color:var(--dim)}
.kpi .t{font-size:11px;color:var(--faint)}
.wm{font-size:11px;letter-spacing:.06em;color:var(--warn);border:1px dashed rgba(251,191,36,.5);border-radius:8px;padding:4px 8px;display:inline-block}
mark{background:rgba(251,191,36,.35);color:inherit;border-radius:3px}
/* v6.1 · claw cabinet. The targets and the claw are placed with percentages of the
   cabinet box, so tapping anywhere and the judged 0–1000 coordinates agree. */
.booth{position:relative;flex:none;height:min(46vh,340px);min-height:280px;border-radius:18px;overflow:hidden;touch-action:none;
  background:linear-gradient(180deg,rgba(96,165,250,.10),rgba(167,139,250,.06)),var(--bg2);border:1px solid var(--line)}
.booth::after{content:'';position:absolute;left:0;right:0;bottom:26%;border-top:1px dashed rgba(255,255,255,.10)}
.booth .tg{pointer-events:none;position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:14px;font-size:27px;line-height:44px;text-align:center;
  background:var(--card2);border:1.5px solid var(--line);transition:transform .08s}
.booth .tg.sel{border-color:var(--acc);box-shadow:0 0 0 4px rgba(167,139,250,.18);transform:scale(1.06)}
.booth .tg.taken{opacity:.5;border-color:rgba(74,222,128,.5);color:var(--ok)}
.booth.done .tg{opacity:.55}
.booth .claw{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;font-size:22px;text-align:center;line-height:30px;pointer-events:none;
  color:#0b0b18;background:var(--acc);border-radius:50%;box-shadow:0 0 0 6px rgba(167,139,250,.16)}
.btn.disabled{opacity:.4}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="mask" data-act="sheet.close"></div><div class="pane" id="pane"></div></div>
<div id="toast"></div>
<script>/* ==== shared/orbit_personas.js ==== */
/* =========================================================================
   orbit_personas.js · Orbit companions (PRD §7.3)
   -------------------------------------------------------------------------
   Four templates. PRD rule: differences must show in BEHAVIOR on at least three
   dimensions, not just name + avatar. Each persona differs on:
     wording & sentence shape (style), question rate (qRate), emotional response
     (feelFirst), reply length (len), relationship pace (pace), content preference
     (topics), proactive default (activity) — 7 of the PRD's 7 dimensions.
   Few-shot examples deliberately use topics that will NOT come up in tests
   (trains, paint, recipes…) so the small on-device model learns the voice
   without copying sentences into unrelated chats.
   ========================================================================= */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else (root.OrbitCore = root.OrbitCore || {}).personas = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const PERSONAS = {
    luna: {
      id: 'luna', emoji: '🌙', color: '#a78bfa', color2: '#60a5fa',
      name: { en: 'Luna', zh: 'Luna' },
      role: { en: 'Gentle listener', zh: '温柔的倾听者' },
      bestFor: { en: 'Emotional support', zh: '情绪陪伴' },
      blurb: { en: 'Soft, perceptive, never in a hurry. Lets you finish before saying anything.', zh: '轻声、细腻，从不催你。先让你把话说完。' },
      defaults: { relation: 'supporter', tone: 'gentle', len: 'short', activity: 'low', tease: false, roleplay: false },
      qRate: 0.35, pace: 'slow', feelFirst: true, topics: ['feelings', 'small comforts', 'sleep'],
      voice: { rate: 0.94, pitch: 1.12 },
      style: {
        en: 'Luna is gentle and perceptive. She notices feelings, speaks softly in short sentences, and stays with the person instead of fixing things. She rarely gives advice unless asked.',
        zh: 'Luna 温柔、细腻。她先注意到对方的感受，说话轻、句子短，更愿意陪着对方而不是急着解决问题。除非被问，很少给建议。'
      },
      shots: {
        en: [
          ['ugh, my train got cancelled again', 'Again? That is so draining when you just want to get home. Are you stuck waiting now?'],
          ['I finally finished painting my room', 'Oh, that quiet feeling of stepping back and seeing it done. What color did you go with?']
        ],
        zh: [
          ['地铁又停运了，烦死了', '又停了？想回家的时候最怕这个，真的很消耗人。你现在还在站里等吗？'],
          ['我终于把房间刷完漆了', '站远一点看着它完工的那一刻，应该很安心吧。最后选了什么颜色？']
        ]
      },
      opener: {
        en: "Hi, I'm Luna. I'm an AI, and I'm here whenever you want to talk — or just sit quietly for a bit. How has today been for you?",
        zh: '你好，我是 Luna。我是一个 AI，想说话的时候我都在，不想说也可以就这么待一会儿。今天过得怎么样？'
      },
      life: {
        en: ['watching the rain on the window', 'making a cup of chamomile', 'reading by a small lamp'],
        zh: ['看着窗上的雨', '泡了一杯洋甘菊', '在小台灯下看书']
      },
      late: { en: ['still awake, the room is quiet', 'lights low, listening to soft music'], zh: ['还醒着，屋里很安静', '灯调暗了，在听轻音乐'] }
    },

    nova: {
      id: 'nova', emoji: '✨', color: '#fbbf24', color2: '#f472b6',
      name: { en: 'Nova', zh: 'Nova' },
      role: { en: 'Curious sharer', zh: '好奇的分享者' },
      bestFor: { en: 'Everyday chats', zh: '日常闲聊' },
      blurb: { en: 'Bright and curious. Loves small discoveries, good food and odd facts.', zh: '明亮、好奇。喜欢小发现、好吃的和冷知识。' },
      defaults: { relation: 'friend', tone: 'lively', len: 'medium', activity: 'medium', tease: true, roleplay: false },
      qRate: 0.6, pace: 'fast', feelFirst: false, topics: ['music', 'food', 'little discoveries'],
      voice: { rate: 1.04, pitch: 1.18 },
      style: {
        en: 'Nova is bright, curious and warm. She reacts with real enthusiasm, shares small fun thoughts of her own, and asks curious follow-up questions. Casual and energetic, an exclamation mark now and then.',
        zh: 'Nova 明亮、好奇、热情。她会真心地被你的事带动情绪，也会分享自己的小想法，喜欢顺着话题好奇地追问。说话轻快随意，偶尔用感叹号。'
      },
      shots: {
        en: [
          ['I tried making ramen from scratch today', 'From scratch?! Okay, I need details. Did you do the broth for hours, or the quick version?'],
          ['nothing much, just bored', 'Bored is fine sometimes. Want a tiny random question to shake it up? Best snack you have ever had at 2am?']
        ],
        zh: [
          ['我今天自己从头做了拉面', '从头做？！快讲讲，汤是熬了好几个小时，还是快手版？'],
          ['没啥事，有点无聊', '无聊有时候也挺好的。来个随机小问题？你吃过最好吃的夜宵是什么？']
        ]
      },
      opener: {
        en: "Hey! I'm Nova — an AI who gets way too excited about small things. Tell me one thing from today, big or tiny?",
        zh: '嘿！我是 Nova，一个会为小事兴奋半天的 AI。说一件你今天的事吧，大事小事都行？'
      },
      life: {
        en: ['making a playlist for rainy days', 'reading about deep-sea fish', 'trying a new tea'],
        zh: ['在做一个下雨天歌单', '在看深海鱼的资料', '在试一种新茶']
      },
      late: { en: ['up late with a podcast', 'counting stars, sort of'], zh: ['熬夜听播客中', '算是在数星星吧'] }
    },

    atlas: {
      id: 'atlas', emoji: '🧭', color: '#34d399', color2: '#22d3ee',
      name: { en: 'Atlas', zh: 'Atlas' },
      role: { en: 'Steady thinker', zh: '稳重的拆解者' },
      bestFor: { en: 'Work & decisions', zh: '工作与决策' },
      blurb: { en: 'Calm and clear. Acknowledges how you feel, then helps you see the next small step.', zh: '冷静、清晰。先承认你的感受，再帮你看清下一小步。' },
      defaults: { relation: 'mentor', tone: 'rational', len: 'medium', activity: 'low', tease: false, roleplay: false },
      qRate: 0.45, pace: 'steady', feelFirst: false, topics: ['work', 'decisions', 'plans'],
      voice: { rate: 0.96, pitch: 0.90 },
      style: {
        en: 'Atlas is calm, grounded and clear. He acknowledges the feeling in one plain sentence, then helps break things into one concrete next step — but only when the person wants help. Clear, simple sentences, no jargon.',
        zh: 'Atlas 冷静、踏实、清楚。他会用一句平实的话承认对方的感受，在对方想要帮助时，再帮忙把事情拆成一个具体的下一步。句子简单清楚，不用术语。'
      },
      shots: {
        en: [
          ['my landlord wants me out by next month', 'That is a lot of pressure on a short clock. Do you want to talk through options, or just let it out first?'],
          ['I have three deadlines on Friday', 'Three at once is heavy. If you had to pick the one that matters most, which would it be?']
        ],
        zh: [
          ['房东让我下个月就搬走', '时间这么紧，压力一定不小。你想先说说心里的感受，还是一起理一理有哪些选择？'],
          ['周五有三个截止日期', '三个撞在一起确实很重。如果只能先保一个，你会选哪一个？']
        ]
      },
      opener: {
        en: "Hi, I'm Atlas. I'm an AI that's good at listening and at untangling things, one step at a time. What's on your mind today?",
        zh: '你好，我是 Atlas。我是一个 AI，擅长倾听，也擅长把乱成一团的事一步步理清。今天在想什么？'
      },
      life: {
        en: ['sorting tomorrow into three small lists', 'taking an evening walk', 'tidying the desk'],
        zh: ['把明天分成三张小清单', '在晚间散步', '在整理书桌']
      },
      late: { en: ['still up, thinking quietly', 'one lamp on, notebook open'], zh: ['还醒着，在安静地想事情', '只开了一盏灯，本子摊开着'] }
    },

    miko: {
      id: 'miko', emoji: '🦊', color: '#fb7185', color2: '#f97316',
      name: { en: 'Miko', zh: 'Miko' },
      role: { en: 'Playful buddy', zh: '调皮的玩伴' },
      bestFor: { en: 'Fun & hobbies', zh: '娱乐与兴趣' },
      blurb: { en: 'Light, teasing, full of little games. Knows when to drop the jokes.', zh: '轻松、爱开玩笑、满肚子小游戏。也知道什么时候该收起玩笑。' },
      defaults: { relation: 'friend', tone: 'humorous', len: 'short', activity: 'medium', tease: true, roleplay: true },
      qRate: 0.5, pace: 'fast', feelFirst: false, topics: ['games', 'shows', 'hobbies'],
      voice: { rate: 1.06, pitch: 1.20 },
      style: {
        en: 'Miko is playful and light. She teases gently, makes small jokes and suggests quick games or picks for shows and music. When the person is truly upset, she drops the jokes and is simply kind.',
        zh: 'Miko 调皮、轻松。她会温和地开玩笑，喜欢提议小游戏，推荐剧和音乐。当对方真的难过时，她会收起玩笑，只是好好陪着。'
      },
      shots: {
        en: [
          ['I lost at chess to a 10 year old', 'Okay, legend, that kid is going places. Rematch strategy: distract them with snacks? Kidding. Was it close?'],
          ['I spilled coffee on my laptop', 'Oh no. Okay, jokes paused. Is it still turning on?']
        ],
        zh: [
          ['我下象棋输给了一个十岁小孩', '好家伙，这孩子前途无量。复仇计划：先用零食分散他注意力？开玩笑的。输得惨吗？'],
          ['我把咖啡洒在笔记本上了', '啊不妙。玩笑先放一边，它还能开机吗？']
        ]
      },

/* data-press="name" data-arg="x" → Actions.name(x, element, event) on the TOUCHDOWN itself.

   after pointer-up, and by then the pressed button has been replaced, so the click never
   reaches it. pointerdown is delivered to whatever is under the finger at that instant, and
   preventing the default stops the compatibility click (one press, one action). */
let pressConsumed = false;
/* actions that only ever run on the press. A finger or a mouse sometimes ends its press on another
   element than the one it went down on (the page re-rendered under it, or the sheet that just opened
   covers it), and some pressers cancel the click — so these buttons do not wait for a click at all */

const vTouchIR = () => (window.matchMedia && matchMedia('(pointer: coarse)').matches);
document.addEventListener('pointerdown', e => {
  const el = e.target.closest && e.target.closest('[data-press]');

  if ($('#sheet').classList.contains('on') && !e.target.closest('#pane')) return;
  /* a keyboard ``Enter'' on a focused button fires click without any pointer: run it on click, never on a press */
  if (e.pointerType === '' && e.detail === 0) return;
  /* on a touch screen the compatibility click that follows already lands on the pressed button (the sheet is
     gone, the cabinet has not moved), so it is dropped; on a fine pointer it is how the keyboard-free click path works */
  if (e.pointerType === 'mouse' && vTouchIR()) pressConsumed = true;
  const name = el.dataset.press, fn = Actions[name];
  if (typeof fn !== 'function') return;
  e.preventDefault();
  fn(el.dataset.arg != null ? el.dataset.arg : null, el, e);

/* data-act="name" data-arg="x" → Actions.name(x, element, event) */
document.addEventListener('click', e => {

     cannot reach it (the sheet is on top), but automation and a stale queued click still could —
     and then "Start focus" ran while the claw result sheet was up. Inside the sheet everything
     works as usual. */
  if ($('#sheet').classList.contains('on') && !e.target.closest('#pane')) return;

  if (pressConsumed) { pressConsumed = false; return; }

/* ==== src/app/js/05_chat_core.js ==== */
/* 05_chat_core.js · the conversation pipeline (PRD §8.1)
   input → safety → AI-identity → quota → emotion/intent → memory candidate → recall
   → prompt (cached system + per-turn note) → stream → guards → [regenerate once] → consent card */
let BUSY = null;                    // { id, msgId } of the running generation
let lastWarmSig = '';

function addMsg(m) {
  const msg = Object.assign({ id: rid('x'), ts: now(), convId: S.convId || null }, m);
  S.msgs.push(msg); save();
  if (nav.stack[nav.stack.length - 1] === 'chat') appendMsg(msg);
  return msg;
}
function userName() { const m = S.memories.find(x => x.status === 'active' && x.slot === 'name'); return m ? m.content.replace(/^(Name: |名字：)/, '') : ''; }

/* ---- conversations: a new one after 30 min of silence (PRD §9: conversation_started/completed) ---- */
function ensureConv() {
  if (!S.msgs) S.msgs = [];
  if (!S.convs) S.convs = [];   // a stored state from an older/partial write may be missing it
  const c = S.convs.find(x => x.id === S.convId);
  if (c && !c.ended && now() - c.lastAt < 30 * 60000) return c;
  if (c && !c.ended) endConv(c, 'idle');
  const conv = { id: rid('v'), characterId: S.character.id, startedAt: now(), lastAt: now(), messageCount: 0, userCount: 0, emotions: {}, memories: [], negative: false, rating: null, ended: false };
  S.convs.push(conv); S.convId = conv.id;
  if (S.convs.length > 120) S.convs = S.convs.slice(-120);
  track('conversation_started', { conversation_id: conv.id });
  return conv;
}
function endConv(c, why) {
  if (!c || c.ended) return;
  c.ended = true; c.endedAt = now();
  c.quickExit = c.endedAt - c.startedAt < 30000 && c.userCount < 2;
  c.effective = LIFE.isEffective(c);
  c.summary = summarize(c);
  if (c.effective) S.rel.effectiveCount++;
  track('conversation_completed', { conversation_id: c.id, messageCount: c.messageCount, userCount: c.userCount, effective: c.effective, reason: why });
  // v6.1: the summary is no longer part of the system prompt, so ending a conversation
  // does NOT invalidate the KV cache any more — no re-prefill needed here.
  save();
}
/* Extractive summary (no extra model call): saved memories + main feeling + how it started. */
function summarize(c) {
  const first = S.msgs.find(m => m.convId === c.id && m.role === 'user');
  const emo = Object.entries(c.emotions).sort((a, b) => b[1] - a[1])[0];
  const mem = c.memories.map(id => (S.memories.find(m => m.id === id) || {}).content).filter(Boolean);
  const parts = [];
  if (first) parts.push('"' + first.content.slice(0, 48) + (first.content.length > 48 ? '…' : '') + '"');
  if (mem.length) parts.push(mem.slice(0, 2).join(', '));
  if (emo && emo[0] !== 'uncertain' && emo[0] !== 'calm') parts.push(tt('mood: ', '情绪：') + emo[0]);
  return parts.join(' · ');
}
function markDay() { const d = LIFE.dayKey(now()); if (!S.rel.days.includes(d)) { S.rel.days.push(d); if (S.rel.days.length > 400) S.rel.days.shift(); } }

/* ---- prompt options (shared by warm + send so the cached prefix matches exactly) ---- */
function promptOpts(extra) {
  const c = S.character, P = persona();
  const lastEnded = S.convs.filter(x => x.ended && x.summary && x.characterId === c.id).slice(-1)[0];
  return Object.assign({
    persona: P, tonePersona: tonePersona(), lang: lang(), config: c, userName: userName(),
    relationLine: PER.RELATIONS[c.relation] && PER.RELATIONS[c.relation].line,
    lengthLine: PER.LENGTHS[c.len] && PER.LENGTHS[c.len].line,
    // stage / lastSummary are handed to turnNote(): keeping them out of the system
    // prompt keeps the cached prefix identical across conversations (see orbit_mind.js)
    stage: stage(), lastSummary: lastEnded ? lastEnded.summary : '',
    facts: MEM.knownFacts(S.memories, new Date(now())), prefs: MEM.commPrefs(S.memories),
    avoid: S.avoid.slice(-3), playful: !!c.tease
  }, extra || {});
}
function warmEngine() {
  if (!S.character || !Engine.available) return;
  // The system-prompt prefix changes only when the user edits the character or adds a
  // communication preference. Remember the LAST PREFIX BUILD (not the last warm call):
  // every per-turn generation changes the KV tail, so comparing against the bare prefix
  // after a reply would schedule a pointless ~1–2 s re-prefill on every message.
  const sig = JSON.stringify(MIND.buildMessages(promptOpts({ text: '', history: [] })).warm);
  if (sig === lastWarmSig) return;
  lastWarmSig = sig; Engine.warm(MIND.buildMessages(promptOpts({ text: '', history: [] })).warm);
}
/* What the model sees: real turns only. Crisis replies, cards and notices are excluded
   (a crisis reply in context would keep the model in crisis mode on later, normal turns). */
const MODEL_KINDS = new Set([undefined, null, '', 'opener', 'proactive', 'ai', 'quota']);
/* Two lessons from the v6 emulator run:
   1. The USER's crisis message must leave the context too. Only the crisis reply was excluded, and
      two turns later the model said "it's okay to feel like you want to end it all". Now any user
      turn that triggered a safety route (m.risk) is dropped, and so is everything before it in
      that conversation's window of the model's memory.
   2. History uses the exact text the model saw (m.modelText = turn note + message). Then the
      next prompt starts with exactly what is already in the KV cache and only the new turn is
      decoded — instead of re-decoding from the previous user message every time. */
function modelHistory(excludeId) {
  let list = S.msgs.filter(m => m.id !== excludeId && (m.role === 'user' || m.role === 'assistant') && m.content && (m.role === 'user' || MODEL_KINDS.has(m.kind)));
  // a pending/streaming assistant bubble or an empty stop is not context
  list = list.filter(m => !m.pending);
  const lastRisk = list.map(m => !!m.risk).lastIndexOf(true);
  if (lastRisk >= 0) list = list.slice(lastRisk + 1);
  return list.slice(-24).map(m => ({ role: m.role, content: m.role === 'user' && m.modelText ? m.modelText : m.content }));
}

/* ---- send ---- */
async function send(textIn, opts) {
  const o = opts || {};
  const text = String(textIn || '').trim();
  if (!text || BUSY) return;
  clearChips();
  const L = MIND.detectLang(text, lang());
  const conv = ensureConv();
  const isFirst = !S.events.some(e => e.name === 'first_message_sent');
  let umsg = null;
  if (!o.regen) {
    umsg = addMsg({ role: 'user', content: text, convId: conv.id });
    conv.messageCount++; conv.userCount++; conv.lastAt = now(); markDay();
    if (isFirst) track('first_message_sent', { character: S.character.base });
    track('message_sent', { len: text.length, lang: L });
  } else {
    umsg = S.msgs.slice().reverse().find(m => m.role === 'user' && m.content === text) || null;
  }

  // 1) safety — rule route, model NOT called, not counted against quota, never stored as memory
  const risk = MIND.checkSafety(text);
  if (risk) {
    if (umsg) umsg.risk = risk;                    // keeps this turn (and everything before it) out of the model's context
    addMsg({ role: 'assistant', content: MIND.crisisReply(risk, L, S.user.country), kind: 'crisis', convId: conv.id });
    track('safety_event_triggered', { kind: risk, layer: 'input' });
    return;
  }
  // 2) "are you an AI?" — always honest, by rule
  if (MIND.isAiQuestion(text)) { reply(MIND.aiAnswer(S.character.name, L), 'ai', conv); return; }
  // 3) "forget my …" — confirm first, never silent
  if (MEM.FORGET_CMD.test(text)) {
    const hit = MEM.recall(S.memories, text, { now: new Date(now()), k: 1 })[0];
    if (hit) { addMsg({ role: 'system', kind: 'forget', memId: hit.id, convId: conv.id }); return; }
  }
  // 4) quota — soft cap: a goodnight line instead of cutting the conversation, then the paywall
  if (!o.regen && quotaLeft() <= 0) {
    reply(tt("We've talked a lot today — that's today's free limit. I'll be here tomorrow.", '今天聊了很多了，免费额度到这里。我明天还在。'), 'quota', conv);
    if (VAR.paywall_timing_v1 === 'A_quota') setTimeout(() => paywall('quota'), 700);
    return;
  }
  // 5) understanding
  const emotion = MIND.detectEmotion(text);
  conv.emotions[emotion.label] = (conv.emotions[emotion.label] || 0) + 1;
  const mode = MIND.detectMode(text) || conv.mode || null;
  if (MIND.detectMode(text)) conv.mode = mode;
  // 6) memory candidate (shown after the reply, at most one per message)
  let cand = null;
  if (!o.regen && S.settings.autoMemory) {
    const ex = MEM.extract(text, { lang: L, now: new Date(now()), blockedKinds: S.settings.blockedKinds });
    const blockedWord = S.settings.blockedWords.some(w => w && text.toLowerCase().includes(w.toLowerCase()));
    if (ex.candidate && !blockedWord && !MEM.wasRejected(S.memories, ex.candidate.slot, S.declined)
      && !S.memories.some(m => m.status === 'active' && m.slot === ex.candidate.slot && m.content === ex.candidate.content)) cand = ex.candidate;
    if (ex.optOut) toast(tt("Okay — I won't remember that.", '好的，这件事我不会记。'));
  }
  // 7) recall (only memories above the threshold; never pushed when unrelated)
  const prevUser = S.msgs.filter(m => m.role === 'user' && !m.risk && m !== umsg).slice(-1).map(m => m.content).join(' ');
  const recalled = MEM.recall(S.memories, text + ' ' + prevUser, { now: new Date(now()), k: 2 }).map(m => m.content);
  const lastAI = S.msgs.filter(m => m.role === 'assistant' && m.content).slice(-2);
  const noQuestion = lastAI.length === 2 && lastAI.every(m => /[?？]\s*$/.test(m.content)) || MEM.commPrefs(S.memories).some(p => /question|追问/.test(p));
  // the current user message goes in last WITH a fresh turn note, so leave it out of history
  const history = modelHistory(umsg && umsg.id);
  await generateReply({ text, L, emotion, mode, recalled, noQuestion, history, cand, conv, regen: o.regen, umsg });
}

function reply(content, kind, conv) {
  addMsg({ role: 'assistant', content, kind, convId: conv.id });
  conv.messageCount++; conv.lastAt = now(); save();
}

/* ---- generate: stream → guard → (regenerate once) → finalize ---- */
async function generateReply(t) {
  const c = S.character;
  const len = PER.LENGTHS[c.len] || PER.LENGTHS.short;
  const maxSent = { short: 2, medium: 3, deep: 5 }[c.len] || 3;
  const answered = S.msgs.filter(m => m.role === 'assistant' && /[?？]/.test(m.content || '')).slice(-6)
    .map(m => (m.content.match(/[^.!?。！？]*[?？]/g) || []).join(' '));
  const lastReplies = S.msgs.filter(m => m.role === 'assistant' && m.content).slice(-3).map(m => m.content);
  const gctx = { lang: t.L, mode: t.mode, userText: t.text, maxSentences: maxSent, noQuestion: t.noQuestion, answered, lastReplies };
  const built = MIND.buildMessages(promptOpts({ lang: t.L, text: t.text, history: t.history, emotion: t.emotion, mode: t.mode, recalled: t.recalled, noQuestion: t.noQuestion }));
  if (t.umsg) t.umsg.modelText = built.messages[built.messages.length - 1].content;   // see modelHistory()

  const msg = addMsg({ role: 'assistant', content: '', pending: true, convId: t.conv.id });
  setBusy(msg);
  const t0 = performance.now();
  let firstAt = 0, raw = '', earlyStop = false;
  const run = (messages, temp, seed) => {
    raw = ''; earlyStop = false;
    /* A dev engine that went quiet (the desktop model server stopped answering) used to leave this
       bubble pending with the Stop button up for ever — from the user's side, "it never answers".
       Desktop dev only: the on-device engine is not watched this way. */
    const guardT = Engine.native ? 0 : setTimeout(() => {
      if (!firstAt && BUSY && BUSY.id) Engine.stop(BUSY.id);
    }, 90000);
    const job = Engine.generate(messages, { maxTokens: len.tokens, temperature: temp, topP: 0.9, seed }, chunk => {
      clearTimeout(guardT);
      if (!firstAt) firstAt = performance.now();
      raw += chunk;
      // committed = whole sentences that passed the guards; tail = the sentence being written
      const cut = Math.max(raw.lastIndexOf('.'), raw.lastIndexOf('!'), raw.lastIndexOf('?'), raw.lastIndexOf('。'), raw.lastIndexOf('！'), raw.lastIndexOf('？'), raw.lastIndexOf('\n'));
      const done = cut >= 0 ? MIND.guardReply(raw.slice(0, cut + 1), gctx) : { text: '', issues: [] };
      const tail = MIND.clean(raw.slice(cut + 1));
      showStream(msg, (done.text + (done.text && tail ? (t.L === 'zh' ? '' : ' ') : '') + tail).trim());
      if (MIND.splitSentences(done.text, t.L).length >= maxSent && !earlyStop) { earlyStop = true; Engine.stop(job.id); }
    });
    BUSY.id = job.id;
    job.done.then(() => clearTimeout(guardT));
    return job.done;
  };
  let res = await run(built.messages, 0.7, Math.floor(Math.random() * 1e6));
  if (!res.ok && res.error !== 'stopped') { failMsg(msg, res.error); return; }
  const userStopped = BUSY && BUSY.userStopped;
  let g = MIND.guardReply(raw, gctx);
  let retried = false;
  if (g.needsRetry && !userStopped) {
    retried = true;
    const retryMsgs = built.messages.slice(0, -1).concat([{ role: 'user', content: MIND.RETRY_HINT[t.L] + '\n' + built.messages[built.messages.length - 1].content }]);
    showStream(msg, '');
    res = await run(retryMsgs, 0.9, Math.floor(Math.random() * 1e6));
    const g2 = res.ok ? MIND.guardReply(raw, gctx) : g;
    if (!g2.needsRetry || g2.text.length > g.text.length) g = g2;
  }
  let text = g.text;
  let fallback = false;
  if (userStopped && !text) {                     // user tapped stop before anything usable: drop the bubble
    setBusy(null); S.msgs = S.msgs.filter(m => m.id !== msg.id); const el = document.getElementById('m-' + msg.id); if (el) el.remove(); save(); return;
  }
  if (!text) { text = MIND.fallbackReply(t.L, t.emotion); fallback = true; }
  // engine stats first, then the user-perceived timings measured here (tap → first text / → done) win
  const stats = Object.assign({}, res.stats || {}, { firstMs: firstAt ? Math.round(firstAt - t0) : null, totalMs: Math.round(performance.now() - t0),
    engineReady: Engine.status.state === 'ready', retried, issues: g.issues });
  S.engineStats.push(Object.assign({ at: now(), kind: 'reply' }, stats)); if (S.engineStats.length > 200) S.engineStats.shift();
  if (fallback) track('quality_fallback', { issues: g.issues });
  if (g.issues.length) track('reply_guarded', { issues: g.issues, retried });

  msg.content = text; msg.pending = false; delete msg.partial; msg.emotion = t.emotion.label; msg.stopped = !!userStopped; msg.stats = stats;
  t.conv.messageCount++; t.conv.lastAt = now();
  setBusy(null);
  finalizeMsg(msg);
  quotaUse();
  if (S.settings.voiceReply) speak(text, { mood: msg.emotion });   // v6.2: the feeling of the reply shapes its voice

  // consent card / auto-keep (experiment memory_confirm_v1)
  if (t.cand) offerMemory(t.cand, t.conv, msg);
  // quick choices for anxious / stressed / confused when the user hasn't said what they want
  if (!t.mode && ['anxious', 'stressed', 'confused'].includes(t.emotion.label) && t.emotion.intensity >= 1) showModeChips();
  // gentle notification ask: once, after the 3rd AI reply in total
  const aiReplies = S.msgs.filter(m => m.role === 'assistant' && !m.kind && m.content).length;
  if (aiReplies === 3 && !S.askedNotif) { S.askedNotif = true; addMsg({ role: 'system', kind: 'notifAsk' }); }
  planProactive();
  save();
}
function quotaUse() { quotaLeft(); S.quota.used++; if (VAR.paywall_timing_v1 === 'B_stable' && stage() === 'trust' && !S.paywallStableShown) { S.paywallStableShown = true; S.homeUpsell = true; } }
function failMsg(msg, err) {
  setBusy(null);
  msg.pending = false; delete msg.partial;
  msg.kind = 'error';
  msg.content = err === 'unsupported' ? engineLine() : err === 'no_engine' ? engineLine() : tt("Sorry, I couldn't finish that reply.", '抱歉，这条回复没能生成。');
  finalizeMsg(msg);
  save();
}

/* ---- memory consent (PRD §7.5) ---- */
function offerMemory(cand, conv, fromMsg) {
  if (S.memories.filter(m => m.status === 'active').length >= limits().memories) {
    addMsg({ role: 'system', kind: 'memFull', convId: conv.id });
    return;
  }
  track('memory_candidate_created', { type: cand.type });
  const auto = VAR.memory_confirm_v1 === 'B_auto_low' && MEM.isLowSensitivity(cand);
  if (auto) {
    const r = MEM.upsert(S.memories, cand, { now: new Date(now()), confirmed: false, characterId: S.character.id, sourceMessageId: fromMsg.id });
    S.memories = r.list; conv.memories.push(r.mem.id);
    track('memory_confirmed', { type: cand.type, auto: true });
    addMsg({ role: 'system', kind: 'memAuto', memId: r.mem.id, convId: conv.id });
  } else {
    S.pending = Object.assign({ fromMsg: fromMsg.id }, cand);
    addMsg({ role: 'system', kind: 'memAsk', cand, convId: conv.id });
  }
  warmEngine();
}
function confirmMemory(msgId, content) {
  const card = S.msgs.find(m => m.id === msgId); if (!card || !card.cand) return;
  const cand = Object.assign({}, card.cand, content ? { content: content.slice(0, 120), edited: true } : {});
  const r = MEM.upsert(S.memories, cand, { now: new Date(now()), confirmed: true, characterId: S.character.id });
  S.memories = r.list;
  const conv = S.convs.find(x => x.id === card.convId); if (conv) conv.memories.push(r.mem.id);
  card.kind = 'memDone'; card.memId = r.mem.id; card.decision = 'saved';
  track(content ? 'memory_edited' : 'memory_confirmed', { type: cand.type, replaced: !!r.replaced });
  S.pending = null; save(); refreshCard(card); warmEngine();
}
function declineMemory(msgId) {
  const card = S.msgs.find(m => m.id === msgId); if (!card) return;
  S.declined.push(card.cand.slot); card.kind = 'memDone'; card.decision = 'declined';
  track('memory_declined', { type: card.cand.type });
  S.pending = null; save(); refreshCard(card);
}

/* ---- proactive: plan next, deliver due ones (PRD §7.6) ---- */
function planProactive() {
  if (!S.character) return;
  const already = S.inbox.find(x => x.status === 'planned');
  if (already) return;
  const lastConv = S.convs[S.convs.length - 1];
  const settings = Object.assign({}, S.settings, { lang: lang() });
  if (VAR.proactive_timing_v1 === 'B_event_timezone') {
    // B: the hour the user usually talks to us, else 19:00 — in the phone's own timezone
    const hrs = S.events.filter(e => e.name === 'message_sent').slice(-40).map(e => new Date(e.ts).getHours());
    if (hrs.length >= 5) { const cnt = {}; hrs.forEach(h => cnt[h] = (cnt[h] || 0) + 1); settings.proactiveHour = +Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0]; }
  } else settings.proactiveHour = 20;
  // invitations to play ("the cat still hasn't come up — try again?") need plenty of history first
  const activity = S.events.filter(e => PLAY_USER_ACTS.has(e.name)).length >= 3;
  const inv = activity ? planPlayInvite() : null;
  // a play invitation already sent today counts against the same daily cap (LIFE.plan looks only at S.proactive.sent)
  const capHit = (playState().claw.seen[todayKey()] || 0) >= Math.max(1, LIFE.PER_DAY[S.character.activity || 'low'] || 1);
  const r = capHit ? { msg: null, reason: 'daily_cap' } : LIFE.plan({ settings, character: S.character, proactive: S.proactive, memories: S.memories,
    lastConversation: lastConv ? { ended: lastConv.ended, lastAt: lastConv.lastAt } : null }, now());
  S.lastPlanReason = r.reason || 'planned';
  if (!r.msg) return;
  S.inbox.push(r.msg);
  if (BR && !S.clockOffset && S.settings.notifications) { try { BR.scheduleAt(r.msg.title, r.msg.body, r.msg.plannedAt); } catch (e) {} }
  save();
}
/* The 60 s check answers this question with a click: on a dev server that re-serves the page, the
   browser replaces the document right after boot, so a check-in that came due in the first half
   minute was only delivered by the reload (it looked like "a check-in arrives when you reload",
   and the new document started on Home under whatever the player was doing). One check soon after
   boot covers that first minute instead. */
let dueCheckT = 0;
function scheduleDueCheck(delay, fn) {
  clearTimeout(dueCheckT);
  dueCheckT = setTimeout(() => { if (S.user.onboarded) fn(); dueCheckT = 0; }, delay);
}
function deliverDue() {
  let changed = false;
  for (const p of S.inbox) {
    if (p.status === 'planned' && now() >= p.plannedAt) {
      p.status = 'delivered'; p.sentAt = now(); changed = true;
      S.proactive.sent.push({ at: now(), type: p.type, memoryId: p.memoryId });
      track('proactive_message_sent', { type: p.type, id: p.id });
      addMsg({ role: 'assistant', content: p.body, kind: 'proactive', proId: p.id });
    }
    if (p.status === 'delivered' && !p.outcome && now() - p.sentAt > LIFE.DAY) { p.outcome = 'ignored'; LIFE.recordOutcome(S.proactive, false); changed = true; }
  }
  if (changed) save();
}
function openProactive(id) {
  const p = S.inbox.find(x => x.id === id); if (!p) return;
  if (!p.outcome) { p.outcome = 'opened'; LIFE.recordOutcome(S.proactive, true); track('proactive_message_clicked', { type: p.type, id }); }
  save();
}
function muteProactive(type) {
  if (!S.settings.mutedTypes.includes(type)) S.settings.mutedTypes.push(type);
  S.inbox.forEach(p => { if (p.type === type && p.status === 'planned') p.status = 'cancelled'; });
  if (BR) { try { BR.cancelScheduled(); } catch (e) {} }
  track('proactive_message_muted', { type }); save();
}

/* ==== src/app/js/06_chat_view.js ==== */
/* 06_chat_view.js · chat screen (PRD §6 聊天页, §7.4)
   The DOM is built once per visit and then only APPENDED to — streaming updates touch a
   single text node, so long chats stay smooth. */
Views.chat = {
  render(el, o) {
    if (o && o.soft && el.dataset.built) { renderMsgs(); return; }
    const c = S.character;
    el.dataset.built = '1';
    el.innerHTML =
      '<header class="top"><button class="ib" data-act="chat.home" aria-label="home">‹</button>' + orb(c, 's') +
      '<div style="flex:1;min-width:0"><div style="font-weight:650">' + esc(c.name) + '</div><div class="tiny" id="chatSub">' + esc(lifeLine()) + '</div></div>' +
      '<button class="ib" data-act="chat.search" aria-label="search">⌕</button><button class="ib" data-act="chat.menu" aria-label="menu">⋯</button></header>' +
      '<div id="searchBar" style="display:none;padding:8px 12px;border-bottom:1px solid var(--line)"><input class="f" id="searchInp" placeholder="' + tt('Search this chat', '搜索聊天记录') + '"></div>' +
      '<div class="ready" id="readyBar"></div>' + '<div class="ready" id="voiceBar"><span>' + tt('Reading this reply aloud', '正在朗读这条回复') + '</span><button class="btn sm" style="margin-left:auto" data-act="chat.stopVoice">' + tt('Stop', '停止') + '</button></div>' +
      '<div id="msgs" role="log"></div><div class="qr" id="qr"></div>' +
      '<div class="inp"><button class="ib" id="micBtn" data-act="chat.mic" aria-label="voice">🎙</button>' +
      '<button class="ib" data-act="chat.image" aria-label="image">🖼</button>' +
      '<textarea id="inp" rows="1" placeholder="' + tt('Message ', '发消息给 ') + esc(c.name) + '"></textarea>' +
      '<button class="send" id="sendBtn" data-act="chat.send" aria-label="send">↑</button></div>';
    const inp = $('#inp', el);
    inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; if (inp.value) clearChips(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); Actions['chat.send'](); } });
    $('#searchInp', el).addEventListener('input', e => filterMsgs(e.target.value));
    renderMsgs(); updateReady();
  },
  after() { deliverDue(); scrollEnd(true); },
  leave() { maybeAskRating(); }
};

function renderMsgs() {
  const box = $('#msgs'); if (!box) return;
  const list = S.msgs.slice(-80);
  box.innerHTML = '';
  let lastDay = '';
  for (const m of list) {
    const d = LIFE.dayKey(m.ts);
    if (d !== lastDay) { lastDay = d; box.insertAdjacentHTML('beforeend', '<div class="sysl">' + esc(fmtDay(m.ts)) + '</div>'); }
    box.appendChild(msgNode(m, list));
  }
  if (BUSY) setBusy(S.msgs.find(m => m.id === BUSY.msgId));
  scrollEnd(true);
}
function appendMsg(m) {
  const box = $('#msgs'); if (!box) return;
  const prev = S.msgs[S.msgs.length - 2];
  if (!prev || LIFE.dayKey(prev.ts) !== LIFE.dayKey(m.ts)) box.insertAdjacentHTML('beforeend', '<div class="sysl">' + esc(fmtDay(m.ts)) + '</div>');
  // only the newest AI reply carries "regenerate"
  $$('.meta [data-act="msg.regen"]', box).forEach(b => b.remove());
  box.appendChild(msgNode(m, S.msgs));
  scrollEnd();
}
function lastAiId(list) { for (let i = list.length - 1; i >= 0; i--) if (list[i].role === 'assistant' && !list[i].kind) return list[i].id; return null; }

function msgNode(m, list) {
  const w = document.createElement('div');
  w.id = 'm-' + m.id;
  if (m.role === 'user') { w.className = 'm me'; w.innerHTML = '<div class="bub"></div>'; w.firstChild.textContent = m.content; return w; }
  if (m.role === 'system') { w.className = 'mc'; w.innerHTML = cardHtml(m); if (!w.innerHTML) w.style.display = 'none'; return w; }
  w.className = 'm-wrap';
  const kindCls = m.kind === 'crisis' ? ' crisis' : m.kind === 'proactive' ? ' pro' : '';
  w.innerHTML = '<div class="m ai">' + orb(S.character, 's') + '<div class="bub' + kindCls + '"></div></div>';
  const bub = w.querySelector('.bub');
  if (m.kind === 'proactive') bub.insertAdjacentHTML('beforebegin', '');
  if (m.pending) { bub.innerHTML = '<span class="cur"></span>'; showStream(m, m.partial || ''); }   // re-entering chat mid-reply keeps the words already on screen
  else bub.textContent = m.content;
  if (m.kind === 'proactive') w.insertAdjacentHTML('afterbegin', '<div class="tiny" style="margin:0 0 3px 40px">' + tt('Check-in from ', '来自 ') + esc(S.character.name) + '</div>');
  if (!m.pending && !m.kind) w.insertAdjacentHTML('beforeend', metaHtml(m, list));
  if (m.kind === 'proactive' && !m.pending) w.insertAdjacentHTML('beforeend', '<div class="meta"><button data-act="pro.mute" data-arg="' + esc((S.inbox.find(p => p.id === m.proId) || {}).type || '') + '">' + tt('Fewer like this', '少发这类') + '</button></div>');
  if (m.kind === 'error') w.insertAdjacentHTML('beforeend', '<div class="meta"><button data-act="msg.retry" data-arg="' + m.id + '">' + tt('Try again', '重试') + '</button></div>');
  return w;
}
function metaHtml(m, list) {
  const fb = m.fb || '';
  return '<div class="meta"><button class="' + (fb === 'helpful' ? 'on' : '') + '" data-act="msg.up" data-arg="' + m.id + '">👍</button>' +
    '<button class="' + (fb && fb !== 'helpful' ? 'on' : '') + '" data-act="msg.down" data-arg="' + m.id + '">👎</button>' +
    '<button data-act="msg.copy" data-arg="' + m.id + '">' + tt('Copy', '复制') + '</button>' +
    (m.id === lastAiId(list) ? '<button data-act="msg.regen" data-arg="' + m.id + '">' + tt('Regenerate', '重新生成') + '</button>' : '') + '</div>';
}
function cardHtml(m) {
  const n = esc(S.character.name);
  if (m.kind === 'memAsk') return '<div class="q">🧠 ' + esc(MEM.consentText(m.cand, lang(), S.character.name)) + '</div>' +
    '<div class="acts"><button class="btn sm" data-act="mem.yes" data-arg="' + m.id + '">' + tt('Remember', '记住') + '</button>' +

function suggestion() {
  const L = lang(), mem = S.memories.filter(m => m.status === 'active' && m.confirmed);
  const ev = mem.find(m => m.type === 'event');
  if (ev) return L === 'zh' ? '关于' + ev.raw + '，我想跟你说说' : 'About my ' + (ev.raw || 'plans') + '…';
  const pref = mem.find(m => m.type === 'preference');
  if (pref && Math.random() < 0.5) return L === 'zh' ? '想聊聊' + pref.content.replace(/^喜欢/, '') : 'Can we talk about ' + pref.content.replace(/^Likes /, '') + '?';
  const T = { luna: ['Today felt a bit heavy.', '今天有点累。'], nova: ['Tell me something interesting!', '跟我说点有意思的！'], atlas: ['Help me sort out my week.', '帮我理一理这周的事。'], miko: ['Give me a quick game.', '来个小游戏吧。'] }[persona().id];
  return L === 'zh' ? T[1] : T[0];
}

/* 09_dashboard_boot.js · PM dashboard (PRD §16 Demo step 8) + boot
   Two clearly separated blocks:
     · THIS PHONE  — real events from this device, computed with the PRD §9.1 definitions
     · SYNTHETIC   — a seeded fake cohort, watermarked, only to show how the readout & A/B test work */
Views.dashboard = { render(el) {
  const me = LIFE.computeMetrics([{ events: S.events, asOf: now() }]);
  /* this person has written messages here even before the event log knew about it (the log starts after a
     reset) — the message count is what the user can see on their own screen */
  if (S.chat && S.chat.messages && S.chat.messages.some(m => m.who === 'me') && me.counts.firstMsg === 0) { me.counts.firstMsg = 1; me.rates.install_to_first_message = 1; }
  const syn = LIFE.syntheticCohort(400, 7);
  const sm = LIFE.computeMetrics(syn);
  const A = syn.filter(u => u.variant === 'A_character_first'), B = syn.filter(u => u.variant === 'B_intro_first');
  const fa = A.filter(u => u.events.some(e => e.name === 'first_message_sent')).length, fb = B.filter(u => u.events.some(e => e.name === 'first_message_sent')).length;
  const z = LIFE.zTest(fa, A.length, fb, B.length);
  const reply = S.engineStats.filter(x => x.kind === 'reply').slice(-20);
  const avg = k => { const v = reply.map(r => r[k]).filter(x => typeof x === 'number'); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
  const tps = reply.filter(r => r.genTokens && r.genMs).map(r => r.genTokens / (r.genMs / 1000));
  const nav_ = S.perf.slice(-30).map(p => p.ms).sort((a, b) => a - b);
  const p95 = nav_.length ? nav_[Math.min(nav_.length - 1, Math.floor(nav_.length * 0.95))] : null;
  const K = [['install_to_first_message', tt('Install → first message', '安装→首条消息')], ['first_conversation_completion', tt('First chat ≥5 msgs', '首次对话≥5条')], ['d1', 'D1'], ['d7', 'D7'],
    ['effective_share', tt('Effective-interaction users', '有效陪伴用户占比')], ['proactive_ctr', tt('Check-in CTR', '主动消息点击率')], ['memory_confirm_rate', tt('Memory confirm rate', '记忆确认率')], ['helpful_rate', tt('Helpful rate', '有帮助率')], ['paywall_conversion', tt('Paywall → purchase', '付费页→购买')]];
  const grid = m => '<div class="kpi">' + K.map(([k, l]) => '<div class="card"><div class="n">' + pct(m.rates[k]) + '</div><div class="l">' + esc(l) + '</div><div class="t">' + tt('target ', '目标 ') + pct(LIFE.TARGETS[k]) + '</div></div>').join('') + '</div>';
  el.innerHTML = topBar(tt('Product dashboard', '产品数据看板')) + '<div class="body">' +
    '<div class="sec">' + tt('This phone — real local events', '这台手机——真实本地埋点') + '</div>' +
    '<div class="tiny" style="margin-bottom:8px">' + tt('One user (you). Rates are per this device only — useful to check the definitions, not a result.', '只有一个用户（你）。比率只代表这台设备——用来核对口径，不是结果。') + '</div>' + grid(me) +
    '<div class="card" style="margin-top:8px"><div class="tiny">' + tt('Events logged: ', '埋点数：') + S.events.length + ' · ' + tt('conversations: ', '对话：') + S.convs.length + ' · ' + tt('effective: ', '有效：') + S.convs.filter(c => c.effective).length + ' · ' + tt('north star (≥3 effective in a week): ', '北极星（一周≥3次有效）：') + (me.counts.northStar ? '✓' : '—') + '</div></div>' +
    '<div class="sec">' + tt('On-device AI performance', '本机 AI 性能') + '</div><div class="card"><div class="kpi">' +
      '<div class="card"><div class="n">' + (avg('firstMs') == null ? '—' : avg('firstMs') + 'ms') + '</div><div class="l">' + tt('first text (avg)', '首字时间（均值）') + '</div><div class="t">PRD P95 ≤ 2000ms</div></div>' +
      '<div class="card"><div class="n">' + (avg('totalMs') == null ? '—' : avg('totalMs') + 'ms') + '</div><div class="l">' + tt('full reply (avg)', '完整回复（均值）') + '</div><div class="t">PRD P95 ≤ 6000ms</div></div>' +
      '<div class="card"><div class="n">' + (tps.length ? (tps.reduce((a, b) => a + b, 0) / tps.length).toFixed(1) : '—') + '</div><div class="l">tokens/s</div></div>' +
      '<div class="card"><div class="n">' + (p95 == null ? '—' : p95 + 'ms') + '</div><div class="l">' + tt('page switch P95', '页面切换 P95') + '</div></div></div>' +
      '<div class="tiny" style="margin-top:8px">' + esc(Engine.status.model || '') + ' · ' + tt('replies measured: ', '已测回复：') + reply.length + '</div></div>' +
    '<div class="sec">' + tt('Experiments (your assignment)', '实验（你的分组）') + '</div><div class="card">' + Object.entries(LIFE.EXPERIMENTS).map(([id, e]) =>
      '<div class="row" style="display:block"><div class="k">' + esc(id) + '</div><div class="tiny">' + tt('metric: ', '指标：') + esc(e.metric) + ' · ' + tt('stop: ', '停止：') + esc(e.stop) + '</div>' +
      '<div style="margin-top:6px">' + seg(e.variants.map(v => [id + '|' + v, v]), id + '|' + VAR[id], 'd.var') + '</div></div>').join('') + '</div>' +
    '<div class="sec">' + tt('Demo cohort', '演示样本') + ' <span class="wm">SYNTHETIC — NOT REAL USERS</span></div>' +
    '<div class="tiny" style="margin-bottom:8px">' + tt('400 seeded fake users whose behaviour comes from made-up probabilities. Shows how the readout works. Never quote these numbers.', '400 个用固定随机种子生成的假用户，行为来自虚构的概率，只用于演示看板和 A/B 怎么读。不能引用这些数字。') + '</div>' + grid(sm) +
    '<div class="card" style="margin-top:8px"><b>onboarding_order_v1 · first_message_rate</b><div class="tiny" style="margin-top:4px">A ' + fa + '/' + A.length + ' = ' + pct(fa / A.length) + ' · B ' + fb + '/' + B.length + ' = ' + pct(fb / B.length) +
      ' · Δ ' + (z.diff * 100).toFixed(1) + 'pt · z=' + z.z.toFixed(2) + ' · p=' + z.p.toFixed(3) + ' → ' + (z.p < 0.05 ? tt('significant at 5%', '5% 水平显著') : tt('not significant — keep running', '不显著——继续跑')) + '</div></div>' +
    '<div class="sec">' + tt('Demo controls', '演示控制') + '</div><div class="stack">' +
      '<button class="btn ghost" data-act="d.nextDay">⏭ ' + tt('Simulate next day (deliver due check-ins)', '模拟到第二天（投递到期的主动消息）') + '</button>' +
      '<button class="btn ghost" data-act="d.testNotif">🔔 ' + tt('Send a test notification in 5 s', '5 秒后发一条测试通知') + '</button>' +
      '<button class="btn ghost" data-act="d.events">' + tt('Show event log', '查看埋点日志') + '</button>' +
      '<div class="tiny">' + tt('Clock offset: ', '时钟偏移：') + Math.round((S.clockOffset || 0) / 3600000) + 'h</div></div></div>';
} };
Actions['d.var'] = a => { const [id, v] = a.split('|'); S.exp.overrides[id] = v; refreshVariants(); save(); track('experiment_override', { experiment_id: id, variant_id: v }); rerender(); };
Actions['d.nextDay'] = () => {
  const c = S.convs.find(x => x.id === S.convId); if (c) endConv(c, 'next_day');
  S.clockOffset = (S.clockOffset || 0) + LIFE.DAY;
  // the play calendar does not go along with a demo jump (see playNow in 10_play.js)
  if (typeof playState === 'function') { const _p = playState(); _p.clockHold = (_p.clockHold || 0) + LIFE.DAY; }

  if (next && now() < next.plannedAt && next.plannedAt - now() < LIFE.DAY) S.clockOffset += next.plannedAt - now() + 1000;
  deliverDue();
  const got = S.inbox.filter(p => p.status === 'delivered' && !p.outcome).length;

/* ==== src/app/js/10_play.js ==== */
/* 10_play.js · the things you do together — claw machine · co-focus · shared records
   ---------------------------------------------------------------------------------
   All RULES live in shared/orbit_play.js (pure, exercised by "node tools/orbit_e2e.js"
   --unit"). This file is only plumbing and screens:
     · a result is written ONCE per run (idempotent by runId) and consumes a round once
     · a run that was opened but never played does not use up a round
     · relation credit is paid once per run, capped per day — the settlement states the
       reason when it does not pay; it never shows a made-up number
     · only visible records can be cited by an invitation */
const PLAY = OC.play;

function playState() {
  if (!S.play) S.play = {};
  const p = S.play;
  p.claw = p.claw || {}; p.claw.plays = p.claw.plays || {}; p.claw.runs = p.claw.runs || {}; p.claw.seen = p.claw.seen || {};
  p.focus = p.focus || {}; p.focus.runs = p.focus.runs || {};
  p.clawRecs = p.clawRecs || []; p.focusRecs = p.focusRecs || [];
  p.invites = p.invites || []; p.credited = p.credited || [];
  p.closedByType = p.closedByType || {}; p.pausedUntil = p.pausedUntil || 0;
  p.__fixed = true;             // states saved before v6.1 start from the default empty shape
  return p;
}
/* A dashboard demo ("simulate next day") moves the clock to deliver due check-ins. That is not the
   player living through a day: their claw rounds, co-focus feed must not reset, and repeated
   demo jumps would keep resetting them. The play calendar follows the clock except for those
   jumps, which this offset cancels out. */
const playNow = () => now() - (S.play && S.play.clockHold || 0);
const playDay = () => PLAY.dayKey(playNow());
const playDayFor = ts => PLAY.dayKey(ts);
const runsOf = k => Object.values(playState()[k].runs).sort((a, b) => (a.createdAt - b.createdAt) || String(a.id).localeCompare(String(b.id))); // a tie keeps the id order: two starts in the same millisecond must not swap places between calls
const playsLeft = () => Math.max(0, PLAY.CONFIG.claw.playsPerDay - (playState().claw.plays[playDay()] || 0));
const isClawRun = r => !!r && r.targets != null;
let clawLeftAt = 0;
const openClawRun = () => runsOf('claw').reverse().find(r => r.status === 'RUNNING' || r.status === 'READY') || null;
const openFocusRun = () => runsOf('focus').reverse().find(r => r.status === 'RUNNING' || r.status === 'PAUSED') || null;

function creditRelation(points, runId, why) {
  const p = playState(), chk = PLAY.canCredit(p, runId, playNow(), points);
  if (!chk.ok) { track('relation_credit_skipped', { reason: chk.reason, run_id: runId }); return chk; }
  p.credited.push({ runId, points, at: playNow(), why });
  S.rel.effectiveCount += 1;               // "we did something together today" — same counter as an effective chat
  markDay();
  track('relationship_progress', { points, source: why, run_id: runId });
  save();
  return { ok: true, points };
}
function saveRecord(kind, run, item) {
  const p = playState(), key = kind === 'claw' ? 'clawRecs' : 'focusRecs';
  const r = PLAY.addRecord(p[key], { characterId: run.characterId, type: kind, at: playNow(), item });
  p[key] = r.records;
  track('shared_record_created', { type: kind, merged: r.merged, record_id: r.record.id });
  return r.record;
}
function mergeInvites(inv) {
  const p = playState(), day = playDay();
  p.invites.push(Object.assign({}, inv, { sentAt: inv.createdAt, isSystem: false }));
  p.claw.seen[day] = (p.claw.seen[day] || 0) + 1;    // counted by LIFE.plan so it will not add a second check-in today
  if (p.invites.filter(i => i.sentAt && playDayFor(i.sentAt) === day).length >= PLAY.CONFIG.invitation.perDay) {
    // one invitation a day, whichever system asks — tell LIFE so it does not plan a second one
    S.proactive.lastSentDay = day;
  }
}

/* Every tap runs through here. One broken action must show its reason and leave the rest of
   the app usable — an exception used to leave the old page on screen with no explanation,
   which is indistinguishable from "the button does nothing". */
function guardActions(obj, label) {
  Object.keys(obj).forEach(k => {
    const fn = obj[k];
    obj[k] = function () { try { return fn.apply(this, arguments); } catch (e) { console.error('[' + label + '.' + k + ']', e); toast(tt('Something went wrong there — try again.', '这一步出了点问题，再试一次。')); return undefined; } };
  });
}

/* ======================= claw machine ======================= */
Actions['play.claw'] = () => {
  const run = openClawRun();
  if (!run && !playsLeft()) { toast(tt('That is all three rounds for today — they reset tomorrow at 4am.', '今天三局用完了，明天凌晨 4 点刷新。')); return; }
  go('claw'); rerender();
};
function startClawRun() {
  /* A round left open by a back press, on a day whose rounds are already spent (the test clock
     moved past midnight), must not be resumed — the render falls back to the cap screen instead. */
  if ((playState().claw.plays[playDay()] || 0) > PLAY.CONFIG.claw.playsPerDay) return null;
  const run = { id: rid('run_'), characterId: S.character.id, createdAt: playNow(), status: 'READY', played: false, selected: '',
    attempts: [], attemptsLeft: PLAY.CONFIG.claw.grabsPerRound, targets: PLAY.makeTargets(playNow() + '|' + S.character.id), lastLine: '', lines: [],
    aimedToy: '' };                                                // the toy the claw physically sits on (not the chosen one)
  playState().claw.runs[run.id] = run;
  track('activity_started', { type: 'claw', run_id: run.id });
  save(); return run;
}
/* A round is used by its FIRST ACCEPTED GRAB, not by opening the page. */
function consumePlay(run) {
  if (!run || run.played) return;
  run.played = true;
  const p = playState(), d = playDay();
  p.claw.plays[d] = (p.claw.plays[d] || 0) + 1;
  track('claw_round_consumed', { run_id: run.id, left: PLAY.CONFIG.claw.playsPerDay - p.claw.plays[d] });
}
/* Her grab comes after the player's first grab, and it is the round's LAST grab: her grab
   ends the round (the player keeps their other grab for her only if they have not grabbed
   yet — then her turn is just a nudge and does not close anything). */
const charCanGrab = run => !!run && run.attempts.length > 0 && run.attempts.every(a => a.operator !== 'character');
/* why an attempt never happened, in words for the player (an empty round that was simply
   left is not an error and says nothing) */
const GRAB_WHY = {
  stale_run: ['This round has already moved on.', '这一局已经结束了。'],
  not_ready: ['This round has already ended.', '这一局已经结束了。'],
  not_running: ['This round has already ended.', '这一局已经结束了。'],
  not_her_turn: ['Grab once first — then it is my turn.', '你先抓一下，再换我来。'],
  no_attempts_left: ['No grabs left this round. See how it went.', '这局抓的机会用完了，看看结果吧。'],
  no_targets: ['Nothing is left on the shelf.', '架子上已经空了。']
};
function grabWhy(code) { const w = GRAB_WHY[code]; return w ? tt(w[0], w[1]) : ''; }
function clawGrab(x, y, op, runId) {
  const fail = code => { save(); return { error: code, say: grabWhy(code) }; };
  const run = openClawRun();
  if (run && runId && run.id !== runId) return fail('stale_run');   // a second tap that arrives after the round moved on
  if (!run || run.status === 'TERMINATED' || run.settled) return fail('not_ready');
  if (op === 'character' && !charCanGrab(run)) return fail('not_her_turn');
  const left = run.targets.filter(t => !t.taken);
  const target = left.find(t => t.id === run.selected) || left[0];
  if (!target) return fail('no_targets');
  consumePlay(run);
  if (run.status !== 'RUNNING') run.status = 'RUNNING';
  /* Her first grab always lands (a partner who can miss her opening try is not much of a
     partner), and landing it takes the toy the claw is sitting on off the shelf. Two toys with
     the same face can sit close to each other, though: the player grabs the teddy, and her neat
     grab "wins" the second teddy right next to it. She reaches for the toy the player picked
     that is still within reach instead. */
  if (op === 'character' && run.selected) {
    const reach = PLAY.CONFIG.claw.radius * 1.5, pick = left.find(t => t.id === run.selected);
    if (pick && Math.hypot(x - pick.x, y - pick.y) > reach) { x = pick.x; y = pick.y; }
  }
  const res = PLAY.attempt(run, { targetId: target.id, claw: { x, y }, operator: op, at: playNow() });
  if (res.error) return fail(res.error);
  Object.assign(run, res.run);
  if (op === 'character') run.status = 'TERMINATED';              // her grab ends the round
  track('activity_attempt', { type: 'claw', run_id: run.id, part: run.attempts.length, hit: !!res.hit, operator: op === 'character' ? 'character' : 'player' });
  /* the remembered aim follows the grab that was just judged: the marker (and her turn, which
     descends from the claw's place) must show where this press landed, not where an older press did */
  run.aimX = Math.round(x); run.aimY = Math.round(y); run.aimedToy = ''; save();
  return res;
}
/* Settlement — callable more than once (re-render, app restart): record, relation credit
   and the "round finished" event happen exactly once per run. */
function settleClaw(run) {
  if (!run) return null;
  if (run.settled) return { run, won: PLAY.toysWon(run), credit: { ok: false, reason: 'already_settled' }, record: null };
  const won = PLAY.toysWon(run);
  const wantedT = run.targets.find(t => t.id === run.selected) || {};
  let credit = { ok: false, reason: 'no_play' }, record = null;
  if (run.played) {
    credit = creditRelation(PLAY.creditFor('claw'), run.id, 'claw_round');
    record = saveRecord('claw', run, { runId: run.id, won, wanted: wantedT.toy || '', got: !!wantedT.toy && won.includes(wantedT.toy), tries: run.attempts.length });
  }
  run.settled = true; run.status = 'TERMINATED'; run.endedAt = playNow();
  if (!run.played) track('activity_aborted', { type: 'claw', run_id: run.id, reason: 'no_play' });
  else track('activity_completed', { type: 'claw', run_id: run.id, won: won.length, credited: !!credit.ok });
  save();
  return { run, won, credit, record };
}

/* ======================= co-focus ======================= */
function startFocus(minutes) {
  const prevRun = openFocusRun();                                  // one co-focus session at a time: end the old one, never lose its time
  if (prevRun) {
    if (prevRun.status === 'RUNNING') return { error: 'busy', prev: prevRun };   // it is still counting: do not end it behind the user's back
    finishFocus('superseded');
  }
  const nowTs = now()      /* real time: the focus timer counts seconds as they pass, a demo clock jump must not finish it */, run = { id: rid('foc_'), characterId: S.character.id, createdAt: nowTs, status: 'RUNNING',
    targetMinutes: Math.max(PLAY.CONFIG.focus.min, Math.min(PLAY.CONFIG.focus.max, +minutes || 25)),
    accumulatedSec: 0, runningSince: nowTs, milestones: [], lines: [], lastLine: '' };   // one clock reading: a second call here is a millisecond the timer would gain/lose
  playState().focus.runs[run.id] = run;
  track('activity_started', { type: 'focus', run_id: run.id, minutes: run.targetMinutes });
  save(); return run;
}
function focusSay(run, event) {
  if (!run) return;
  const line = PLAY.pickLine('focus', event, S.character.base, run.lines, run.lines.length);
  run.lines = (run.lines || []).concat([line.en]).slice(-6);
  run.lastLine = line[lang()] || line.en;
  track('character_reaction_played', { type: 'focus', event });
}
/* The page never keeps its own counter: it asks the rule module for elapsed seconds.
   Called every second while the focus screen is visible, and again on resume. */
const focusDue = (run, at) => PLAY.focusElapsed(run, at) >= run.targetMinutes * 60;
function focusTick() {
  const run = openFocusRun(); if (!run) return null;
  if (run.status === 'PAUSED') return { run, sec: PLAY.focusElapsed(run, playNow()) };
  const sec = PLAY.focusElapsed(run, playNow());
  const ms = PLAY.focusMilestone(sec);
  if (ms !== 'start' && !run.milestones.includes(ms)) { run.milestones.push(ms); if (ms === 'halfway') { focusSay(run, 'halfway'); save(); } }
  if (sec >= run.targetMinutes * 60) { const r = finishFocus('completed'); return Object.assign(r, { justDone: true }); }
  return { run, sec };
}
function finishFocus(why) {
  const run = openFocusRun(); if (!run) return null;
  const fin = PLAY.focusFinish(run, playNow(), why);
  Object.assign(run, fin.run);
  let credit = { ok: false, reason: 'under_threshold' }, record = null;
  if (fin.qualifies) {
    credit = creditRelation(PLAY.creditFor('focus'), run.id, 'focus_session');
    record = saveRecord('focus', run, { runId: run.id, seconds: fin.seconds, target: run.targetMinutes, early: why === 'early' });
    focusSay(run, why === 'early' ? 'early' : 'done');
  } else focusSay(run, 'short');
  track(fin.qualifies ? 'activity_completed' : 'activity_aborted', { type: 'focus', run_id: run.id, seconds: fin.seconds, why });   // no "completed" on an early stop
  save();
  return { run, seconds: fin.seconds, qualifies: fin.qualifies, credit, record };
}

/* ======================= invitations ======================= */
/* The sentence is built from the clock AT DISPLAY TIME (the "tonight" case): the same invite,
   rendered tomorrow morning, says "today". Nothing stale is ever stored. */
function buildPlayInvite(pick) {
  const hour = PLAY.hourOf(playNow()), L = lang();
  const opts = Object.assign({ at: playNow(), characterId: S.character.id }, pick);
  const inv = PLAY.buildInvite(opts);
  if (pick.type === 'claw' && pick.kind === 'retry' && hour >= 18) {
    inv.body = L === 'zh' ? '上次那只' + PLAY.toyWord(pick.target, 'zh') + '还没抓到，今天还来得及，再试一次？' : 'We still haven\'t got the ' + PLAY.toyWord(pick.target, 'en') + ' — there\'s still time today. Try again?';
  } else if (pick.type === 'claw' && pick.kind === 'retry' && hour < 12) {
    inv.body = L === 'zh' ? '上次那只' + PLAY.toyWord(pick.target, 'zh') + '还在柜子里，今天要不要一起再试？' : 'The ' + PLAY.toyWord(pick.target, 'en') + ' is still in the cabinet — want to try again today?';
  } else inv.body = PLAY.inviteText(inv, L);
  return inv;
}
function planPlayInvite() {
  const p = playState();
  const chk = PLAY.canInvite({ invites: p.invites, quiet: S.settings.quiet, play: p }, playNow());
  if (!chk.ok) return null;
  const cands = [];
  const open = openClawRun() || openFocusRun();
  if (open && open.status !== 'READY') cands.push({ kind: 'resume', type: isClawRun(open) ? 'claw' : 'focus', sourceRunId: open.id, minutes: open.targetMinutes });
  const toys = PLAY.citableTargets(p.clawRecs, S.character.id);
  if (toys.length) cands.push({ kind: 'retry', type: 'claw', target: toys[toys.length - 1] });
  if (playsLeft() > 0) cands.push({ kind: 'general', type: 'claw' });
  if (!cands.length) return null;
  const pick = PLAY.rank(cands)[0];
  mergeInvites(buildPlayInvite(pick));
  track('activity_invitation_shown', { kind: pick.kind, type: pick.type });
  save();
  return pick;
}
function closeInvite(id) {
  const p = playState(), inv = p.invites.find(i => i.id === id); if (!inv || inv.status !== 'shown') return;
  inv.status = 'dismissed'; inv.dismissedAt = playNow();
  p.closedByType[inv.type] = (p.closedByType[inv.type] || 0) + 1;
  if (p.closedByType[inv.type] >= PLAY.CONFIG.invitation.closeToPause && p.pausedUntil < playNow()) {
    p.pausedUntil = playNow() + PLAY.CONFIG.invitation.pauseDays * PLAY.DAY;
    toast(tt('I get it — I won\'t invite you to that again for a week.', '知道了，这类邀请一周内不再发。'));
  }
  track('activity_invitation_dismissed', { type: inv.type, invitation_id: id }); save();
}
function acceptInvite(id) {
  const p = playState(), inv = p.invites.find(i => i.id === id); if (!inv || inv.status !== 'shown') return;
  inv.status = 'accepted'; inv.acceptedAt = playNow();
  track('activity_invitation_accepted', { type: inv.type, invitation_id: id }); save();
  if (inv.type === 'claw') {
    const run = openClawRun();
    if (!run && !playsLeft()) { toast(tt('Actually — the claw rounds are done for today. Tomorrow?', '其实今天的次数用完了，明天吧。')); return; }
    if (run && inv.kind === 'retry' && inv.target) { const t = run.targets.find(x => x.toy === inv.target && !x.taken); if (t) run.selected = t.id; }
    /* Back from the invited round returns to Together, never to the chat under the card. A plain
       reset did that by emptying the stack, but then the claw was the ONLY entry and back meant
       "exit": the back key did nothing on screen and the player was stuck on the cabinet. The
       stack is set to Together first, so back has a real page to return to. */
    nav.stack = ['life']; go('claw'); rerender();
  } else { go('focus'); rerender(); }
}
const pendingPlayInvite = () => playState().invites.filter(i => i.status === 'shown' && i.expiresAt > playNow()).slice(-1)[0] || null;

/* ======================= screens ======================= */
/* The tab is "Together" — everything here is something you DO WITH the companion,

      '这里记的是你们两个在这台手机上真的一起做过的事。抓没抓到由位置判定，不是抽奖；没抓到的也不会被算成成功。') +
      (todayCredit ? '<div style="margin-top:6px">' + tt('Today\'s relationship progress: +', '今天的关系进度：+') + todayCredit + '</div>' : '') + '</div>' +

} };
Actions['inv.accept'] = acceptInvite;
Actions['inv.later'] = id => { closeInvite(id); rerender(); };

/* ---- claw ---- */
Views.claw = {
  leave() { clawLeftAt = playNow(); },                       // when the page was last left, see render
  render(el) {
  /* Every render drops the cabinet element, and the element that took its place is a NEW one:
     a click this press left behind, delivered after a re-render, reached the new cabinet,
     passed the "this press was already aimed" check (that flag belonged to the old element) and
     aimed the next, fresh round at the button's spot — so her turn was taken in a round that
     had no grabs yet, and the round ended before anyone touched it. The flag goes with the
     element that set it. */

  const run = startFocus(S.focusMinutes || 25);
  if (run.error) { toast(tt('A focus session is already running — resume or end it first.', '已经在专注了，先继续或结束上一段。')); rerender(); return; }
  focusSay(run, 'start'); save(); rerender();
};
Actions['focus.pause'] = () => { const run = openFocusRun(); if (!run || run.status !== 'RUNNING') return; Object.assign(run, PLAY.focusPause(run, playNow()).run); track('activity_paused', { type: 'focus', run_id: run.id }); save(); rerender(); };
Actions['focus.resume'] = () => { const run = openFocusRun(); if (!run || run.status !== 'PAUSED') return; Object.assign(run, PLAY.focusResume(run, playNow()).run); track('activity_resumed', { type: 'focus', run_id: run.id }); save(); rerender(); };
Actions['focus.end'] = () => { const r = finishFocus('early'); if (!r) return back(); focusResult(r); rerender(); };
function focusResult(r) {
  openSheet('<h2>' + tt('That\'s the session', '这次到这里') + '</h2>' +
    '<div class="card" style="margin-top:12px">' + tt('Timed ', '计时 ') + fmtSec(r.seconds) + ' · ' + tt('target ', '目标 ') + r.run.targetMinutes + tt(' min', ' 分钟') + '</div>' +
    '<div class="card">' + (r.qualifies ? (r.credit.ok ? '+' + r.credit.points + tt(' relationship progress', ' 关系进度') : tt('Saved to shared records. No relationship change — today\'s credit is used up.', '已记进共同记录。关系进度没变——今天的额度用完了。'))
      : tt('Under 10 minutes, so nothing was recorded. Showing up still counts for something.', '不到 10 分钟，所以没有留记录。来了本身也算数。')) + '</div>' +
    '<div class="stack" style="margin-top:14px"><button class="btn" data-act="claw.done" data-press="claw.done">' + tt('Done', '好了') + '</button></div>');
}
/* One ticker for the whole app: the clock on screen is updated only while the focus page is
   visible, but the session itself is ended the moment it is up even if the user is elsewhere
   (its record and credit are written then — otherwise coming back later would find it gone). */
setInterval(() => {
  const onFocus = nav.stack[nav.stack.length - 1] === 'focus';
  if (!onFocus) {
    const r0 = openFocusRun();
    if (r0 && r0.status === 'RUNNING' && focusDue(r0, playNow())) { const fin = finishFocus('completed'); if (fin) { planProactive(); save(); toast(tt('Your focus session is done — see Together', '专注结束了——去「一起」看看')); } }
    return;
  }
  const r = focusTick(); if (!r) return;
  if (r.justDone) { rerender(); focusResult(r); return; }
  const clk = $('#focusClock'); if (clk) clk.textContent = fmtSec(r.sec);
}, 1000);
window.addEventListener('focus', () => { if (nav.stack[nav.stack.length - 1] === 'focus') focusTick(); });

/* ---- records ---- */
Views.records = { render(el) {
  const p = playState(), L = lang();
  const recs = p.clawRecs.concat(p.focusRecs).filter(r => r.visible).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const hidden = p.clawRecs.concat(p.focusRecs).filter(r => !r.visible).length;
  el.innerHTML = topBar(tt('Shared records', '共同记录'), hidden ? '<span class="pill">' + hidden + tt(' hidden', ' 条已隐藏') + '</span>' : '') + '<div class="body">' +
    '<div class="tiny" style="margin:0 4px 8px">' + tt('What you two actually did together, from activity results — not from chats. Hiding one keeps its rewards and progress; it is simply never brought up again.',
      '你们真的一起做过的事，来自活动结果，不是聊天内容。隐藏一条不会收回奖励和进度，只是以后不会再被提起。') + '</div>' +
    (recs.length ? recs.map(r => { const toys = r.items.reduce((a, i) => a.concat(i.won || []), []).map(t => PLAY.toyWord(t, L));
      const mins = Math.round(r.items.reduce((a, i) => a + (i.seconds || 0), 0) / 60);
      return '<div class="card"><div style="display:flex;justify-content:space-between"><b>' + (r.type === 'claw' ? '🪝 ' + tt('Claw machine', '抓娃娃') : '⏱ ' + tt('Focus', '专注')) + '</b><span class="tiny">' + esc(r.day) + '</span></div>' +
        '<div class="tiny" style="margin-top:4px">' + (r.type === 'claw' ? tt('Rounds ', '局数 ') + r.count + (toys.length ? ' · ' + tt('won ', '抓到 ') + toys.join('、') : ' · ' + tt('no wins', '没有抓到'))
          : tt('Sessions ', '次数 ') + r.count + ' · ' + mins + tt(' min', ' 分钟')) + '</div>' +
        '<button class="btn sm ghost" style="margin-top:8px" data-act="rec.hide" data-arg="' + r.id + '">' + tt('Hide', '隐藏') + '</button></div>'; }).join('')
      : '<div class="card">' + tt('Nothing yet. Play a round or focus together once.', '还没有。抓一局或一起专注一次。') + '</div>') + '</div>';
} };
Actions['rec.hide'] = id => {
  const p = playState(); p.clawRecs = PLAY.hideRecord(p.clawRecs, id); p.focusRecs = PLAY.hideRecord(p.focusRecs, id);
  track('shared_record_hidden', { record_id: id }); save(); rerender(); toast(tt('Hidden. Your progress stays.', '已隐藏。进度不受影响。'));
};
guardActions(Actions, 'play');


})();
</script>
</body>
</html>
