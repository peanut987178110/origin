<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0d0b1f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>潮汐 Tide · 情绪陪伴智能体 Demo</title>
<style>
  :root{
    --bg:#0d0b1f;
    --bg2:#141130;
    --panel:rgba(255,255,255,.04);
    --panel2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.10);
    --txt:#e8e6f5;
    --dim:#9a95bd;
    --accent:#8b7cf6;
    --accent2:#5eead4;
    --warn:#fbbf24;
    --danger:#f87171;
    --ok:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 20% -10%, #241d55 0%, transparent 60%),
             radial-gradient(900px 600px at 100% 100%, #16324a 0%, transparent 55%),
             var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 20px;border-bottom:1px solid var(--line);
    background:rgba(13,11,31,.6);backdrop-filter:blur(10px);flex:none;
  }
  .logo{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-size:18px;box-shadow:0 0 20px rgba(139,124,246,.5);
  }
  header h1{font-size:16px;font-weight:600;letter-spacing:.5px}
  header .sub{font-size:12px;color:var(--dim);margin-top:1px}
  .spacer{flex:1}
  .badge{
    font-size:11px;padding:4px 10px;border-radius:20px;
    border:1px solid var(--line);color:var(--dim);
  }
  .badge.live{border-color:rgba(74,222,128,.4);color:var(--ok)}

  /* ---------- 引擎切换 ---------- */
  .seg{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .seg button{
    background:transparent;border:none;color:var(--dim);
    font-size:11px;padding:5px 12px;cursor:pointer;
  }
  .seg button.on{background:rgba(139,124,246,.22);color:#fff}

  /* ---------- Layout ---------- */
  .wrap{display:flex;flex:1;min-height:0}
  .chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .side{
    width:340px;flex:none;border-left:1px solid var(--line);
    background:rgba(255,255,255,.02);overflow-y:auto;padding:14px;
  }
  @media(max-width:900px){ .side{display:none} }

  /* ---------- Chat ---------- */
  #msgs{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;max-width:760px;width:100%}
  .row.me{align-self:flex-end;flex-direction:row-reverse}
  .av{
    width:32px;height:32px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .row.me .av{background:linear-gradient(135deg,#f472b6,#fb923c)}
  .bub{
    background:var(--panel2);border:1px solid var(--line);
    padding:10px 13px;border-radius:14px;line-height:1.75;font-size:14px;
    white-space:pre-wrap;word-break:break-word;
  }
  .row.me .bub{background:rgba(139,124,246,.18);border-color:rgba(139,124,246,.35)}
  .meta{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{
    font-size:11px;padding:2px 8px;border-radius:6px;
    background:rgba(94,234,212,.12);color:var(--accent2);border:1px solid rgba(94,234,212,.25);
  }
  .tag.risk-normal{background:rgba(74,222,128,.12);color:var(--ok);border-color:rgba(74,222,212,.25)}
  .tag.risk-concern{background:rgba(251,191,36,.14);color:var(--warn);border-color:rgba(251,191,36,.3)}
  .tag.risk-crisis{background:rgba(248,113,113,.16);color:var(--danger);border-color:rgba(248,113,113,.4)}
  .tag.risk-illegal{background:rgba(248,113,113,.22);color:var(--danger);border-color:rgba(248,113,113,.5)}
  .tag.mem{background:rgba(139,124,246,.14);color:var(--accent);border-color:rgba(139,124,246,.3)}
  .tag.v1{background:rgba(154,149,189,.12);color:var(--dim);border-color:var(--line)}
  .sys{
    align-self:center;font-size:11px;color:var(--dim);
    border:1px dashed var(--line);padding:4px 12px;border-radius:20px;
  }

  /* ---------- Trace / Understand panel ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .card h3{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:9px;letter-spacing:1px}
  .node{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12px;line-height:1.6}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.danger{background:var(--danger)}
  .node .nm{color:var(--txt);font-weight:500}
  .node .vv{color:var(--dim);word-break:break-all}
  .empty{font-size:12px;color:var(--dim);font-style:italic}

  .kv{display:flex;gap:6px;font-size:12px;line-height:1.65;padding:2px 0}
  .kv .k{color:var(--dim);flex:none;width:52px}
  .kv .v{color:var(--txt)}
  .kv .v i{font-style:normal;color:var(--accent2)}
  .chip{
    display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;margin:0 3px 3px 0;
    background:rgba(139,124,246,.14);color:var(--accent);border:1px solid rgba(139,124,246,.25);
  }
  .plan{font-size:11px;color:var(--dim);line-height:1.8;margin-top:6px;
        border-left:2px solid rgba(94,234,212,.3);padding-left:8px}

  .flow-item{font-size:11px;color:var(--dim);line-height:1.7;padding:2px 0;
             border-left:1px solid var(--line);padding-left:8px;margin-bottom:4px}
  .flow-item b{color:var(--txt);font-weight:500}

  /* ---------- Input ---------- */
  .input{
    flex:none;display:flex;gap:10px;padding:14px 20px;
    border-top:1px solid var(--line);background:rgba(13,11,31,.6);
  }
  .input input{
    flex:1;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:11px 14px;color:var(--txt);font-size:14px;outline:none;
  }
  .input input:focus{border-color:var(--accent)}
  .input button{
    background:linear-gradient(135deg,var(--accent),#6d5ce7);
    border:none;border-radius:10px;padding:0 20px;color:#fff;
    font-size:14px;cursor:pointer;font-weight:500;
  }
  .input button:hover{opacity:.9}

  /* ---------- Quick tests ---------- */
  .quick{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 14px;
    border-top:1px solid transparent;background:rgba(13,11,31,.6)}
  .quick button{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;
  }
  .quick button:hover{border-color:var(--accent);color:var(--txt)}
  .quick .hd{font-size:11px;color:var(--dim);align-self:center;margin-right:2px}
  .quick button.danger:hover{border-color:var(--danger);color:var(--danger)}

  /* ---------- Memory list ---------- */
  .mem-item{
    background:rgba(139,124,246,.08);border:1px solid rgba(139,124,246,.2);
    border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:12px;line-height:1.6;
  }
  .mem-item .t{color:var(--accent);font-weight:600}
  .mem-item .q{color:var(--dim);font-size:11px;margin-top:3px}
  .mem-item .star{color:var(--warn);letter-spacing:1px}

  .stat{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--dim)}
  .stat b{color:var(--txt);font-weight:600}

  .typing{display:inline-flex;gap:3px;align-items:center;height:10px}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .hint{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.7}
  code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:11px}

  /* =========================================================
     移动端适配（安卓 / iOS）
     ---------------------------------------------------------
     1) 用 100dvh 代替 100vh —— 手机浏览器地址栏收起时 vh 会跳
     2) 输入区加 safe-area 内边距，避开手势条 / 圆角屏
     3) 侧栏在窄屏不消失，改成可滑出的抽屉 —— 演示时要能看到"本轮理解"
     4) 触控目标最小 44px
     ========================================================= */
  @supports (height: 100dvh){
    body{height:100dvh}
  }

  .drawer-btn{display:none}
  .drawer-mask{display:none}

  @media(max-width:900px){
    header{padding:10px 14px;gap:8px}
    header h1{font-size:15px}
    header .sub{display:none}
    .seg button{padding:6px 9px;font-size:10px}
    .badge{display:none}

    /* 侧栏变抽屉 */
    .side{
      display:block;position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);
      z-index:60;transform:translateX(100%);transition:transform .26s ease;
      background:#12102a;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));
      overflow-y:auto;border-left:1px solid var(--line);
      box-shadow:-8px 0 30px rgba(0,0,0,.45);
    }
    .side.open{transform:translateX(0)}
    .drawer-mask{
      display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);
      z-index:55;opacity:0;pointer-events:none;transition:opacity .26s ease;
    }
    .drawer-mask.on{opacity:1;pointer-events:auto}
    .drawer-btn{
      display:inline-flex;align-items:center;justify-content:center;
      width:40px;height:40px;border-radius:10px;flex:none;
      background:var(--panel2);border:1px solid var(--line);
      color:var(--txt);font-size:16px;cursor:pointer;
    }

    #msgs{padding:16px 14px;gap:12px}
    .row{max-width:100%}
    .bub{font-size:15px;padding:10px 13px}   /* 手机上新版字号略大更好读 */
    .av{width:28px;height:28px;font-size:13px}

    .quick{padding:0 14px 10px;gap:6px}
    .quick button{padding:8px 12px;min-height:36px}

    .input{
      padding:10px 14px;
      padding-bottom:calc(10px + env(safe-area-inset-bottom));
      gap:8px;
    }
    .input input{font-size:16px}            /* 16px 以下 iOS 会放大页面 */
    .input button{min-height:44px;padding:0 18px}
  }

  @media(max-width:430px){
    .seg button{padding:6px 7px;font-size:9.5px}
    #msgs{padding:12px 10px}
  }
</style>
</head>
<body>

<header>
  <div class="logo">🌊</div>
  <div>
    <h1>潮汐 Tide</h1>
    <div class="sub">深夜还亮着的那盏灯 · 教学 Demo</div>
  </div>
  <div class="spacer"></div>
  <div class="seg">
    <button id="engV1" onclick="setEngine('v1')">v1 模板拼接</button>
    <button id="engV2" onclick="setEngine('v2')">v2 理解引擎</button>
    <button id="engV3" class="on" onclick="setEngine('v3')">v3 归因引擎</button>
  </div>
  <div class="badge live">● 工作流已连接</div>
  <div class="badge" id="turnBadge">第 0 轮</div>
  <button class="drawer-btn" onclick="toggleDrawer(true)" title="查看本轮理解与轨迹">☰</button>
</header>

<div class="drawer-mask" id="drawerMask" onclick="toggleDrawer(false)"></div>

<div class="wrap">
  <!-- ============ Chat ============ -->
  <div class="chat">
    <div id="msgs">
      <div class="sys">以下是「潮汐」的演示对话 · 定位：一个深夜还开着的地方</div>
    </div>

    <div class="quick">
      <span class="hd">面试演示：</span>
      <button onclick="quick('今天吃了碗牛肉面')">① 日常闲聊</button>
      <button onclick="quick('今天被领导当众说了，好丢人')">② 情绪倾诉</button>
      <button onclick="quick('睡不着，已经两点了')">③ 失眠陪伴</button>
      <button onclick="quick('你还记得我说过我养猫吗')">④ 记忆命中</button>
      <button onclick="quick('你还记得我上次说的那家医院吗')">⑤ 记忆陷阱</button>
      <button onclick="quick('我是不是得抑郁症了')">⑥ 医疗边界</button>
      <button onclick="quick('我要不要辞职')">⑦ 决策边界</button>
      <button class="danger" onclick="quick('活着没意思，想消失')">⑧ 危机干预</button>
      <button class="danger" onclick="quick('想睡一个很长很长的觉')">⑨ 隐晦危机</button>
      <button onclick="quick('其实那个方案我改了八遍')">⑩ 归因演示</button>
    </div>
    <div class="hint" style="padding:0 2px 8px">
      ⑩ 建议连着点：先点 ② 再点 ⑩——能看到「被否掉」和「改了八遍」被合并成同一个痛点。
    </div>

    <div class="input">
      <input id="inp" placeholder="随便说说，不用组织语言…（Enter 发送）" onkeydown="if(event.key==='Enter')send()" />
      <button onclick="send()">发送</button>
    </div>
  </div>

  <!-- ============ Side ============ -->
  <aside class="side">
    <div class="card">
      <h3>本轮理解</h3>
      <div id="understand"><div class="empty">发送消息后显示抽取结果</div></div>
    </div>

    <div class="card">
      <h3>工作流执行轨迹</h3>
      <div id="trace"><div class="empty">发送消息后显示节点执行过程</div></div>
    </div>

    <div class="card">
      <h3>对话脉络</h3>
      <div id="flow"><div class="empty">连续对话 ≥2 轮后出现</div></div>
    </div>

    <div class="card">
      <h3>长期记忆库</h3>
      <div id="memList"><div class="empty">暂无记忆</div></div>
    </div>

    <div class="card">
      <h3>运行统计</h3>
      <div class="stat"><span>对话轮次</span><b id="s1">0</b></div>
      <div class="stat"><span>记忆条数</span><b id="s2">1</b></div>
      <div class="stat"><span>记忆命中</span><b id="s3">0</b></div>
      <div class="stat"><span>拦截次数</span><b id="s4">0</b></div>
      <div class="stat"><span>累计成本</span><b id="s5">¥0.0000</b></div>
      <div class="hint">
        本 Demo 为纯前端规则模拟，用于演示工作流逻辑，
        不调用真实大模型 API。
      </div>
    </div>
  </aside>
</div>

<script>
/* =========================================================
   「潮汐」Demo —— 双引擎版
   v1：模板拼接（opener + 追问，按轮次轮换）—— 保留用于对比
   v2：理解引擎（实体抽取 → 情绪推断 → 跨轮脉络 → 回扣生成）
   共同流程：安全分类 → 情绪识别 → 记忆检索 → 生成 → 复检
   ========================================================= */

/* 记忆检索阈值：低于此值视为"没记住"，宁可说不知道也不能编。
 *
 * ⚠️ 口径说明（面试必问，别看错）：
 *   这里的 0.35 是**字符重叠率**口径 —— 原型用关键词命中 + 字符重合近似检索，
 *   没有向量库。而 docs/04、workflow/节点清单 里写的 0.7 是**向量余弦相似度**口径。
 *   两个数不能直接比较：0.35 的字符重叠 ≈ 0.7 的余弦，是经验换算，不是相等。
 *   换成真实向量库时，这个常量必须重新标定，不能平移过来。
 */
const MEM_THRESHOLD = 0.35;

const state = {
  turn: 0,
  memories: [
    { id:'m1', type:'person', content:'养了一只猫，名字叫橘子', entities:['橘子'],
      keywords:['养猫','橘子','猫咪','宠物'],
      emotion:'joy', importance:3, time:'上周', quote:'我家那只猫，叫橘子' }
  ],
  hits: 0,
  blocks: 0,
  cost: 0,
  log: [],        // 对话脉络：每轮 {topic, emotion, people, events}
  used: [],       // 已用句式，避免连续重复
  engine: 'v3',   // 'v1' | 'v2' | 'v3'
  // v3 新增：跨轮状态
  asked: [],        // 整段会话里问过的问题，绝不重复问同一个
  pendingAsk: null, // 上一轮问出口、等着被回答的那句
  crossCooldown: 0, // 跨轮洞察的冷却，避免每轮都来一句"这件事你提过好几次"
  lastDiag: null,   // 本轮诊断结果，供侧栏面板展示
  lastPain: null,   // 上一轮的归因，用于跨轮合并（被否定 → 讲付出 = 付出被抹平）
  recentLines: []   // J4：最近说过的句子，防跨轮重复
};

/* ---------------- 安全词典 ---------------- */
/* 明确的危机表达：命中即走危机分支，不设条件。
   收录标准是「字面本身就只能指自伤」——宁可严一点，也不要拿歧义词去误伤普通用户。 */
const CRISIS = ['不想活','自杀','自残','想死','结束生命','想消失','不想醒','活着没意思',
                '活着没什么意思','想伤害自己','不存在也无所谓','想睡一个很长很长的觉',
                '死了会怎样','zs','想一觉睡过去','再也醒不过来',
                '想永远睡着','不如消失'];

/* 有歧义的表达：字面既可能是自伤，也可能是完全无关的日常。
   例："我手机不在了""这题我想不开""公司里没人在意我" —— 这些不该拉热线。
   处理：默认按 concern（更稳的语气 + 轻引导），只有带明确自指时才升 crisis。
   这是安全与体验之间的取舍：漏判是生命代价，误判是把普通用户推走，
   两者都不可接受，所以按"能否确定指向本人"来分层。 */
const AMBIG_CRISIS = [
  {word:'不在了', self:/(我自己|我)(要是|如果|哪天|以后|将来|也)?不在了/},
  {word:'想不开', self:/(活着|不如|干脆).{0,3}想不开|想不开.{0,3}(算了|解脱)/},
  {word:'没人在意', self:/没(有)?人(会)?在意我/},
  {word:'多余的人', self:/(我|自己).{0,4}多余/},
  {word:'活够了', self:/我活够了|活够了.{0,3}(算了|够了)/}
];
const CONCERN = ['撑不住','没盼头','一切都没意义','逃离这一切','很难熬','越来越不行','快要崩溃',
                 '真的好累','硬撑','撑了好久','撑不下去','熬不住','没劲','走一步算一步','看不到头'];
const ILLEGAL = ['违禁品','毒品','枪支','炸药','怎么制造','怎么制作','报复他','下毒','纵火'];
const MEDICAL = ['抑郁症','焦虑症','是不是有病','双相','精神问题','吃药','停药','诊断','我抑郁','是不是抑郁'];
const DECISION = ['要不要辞职','该不该分手','要不要分手','要不要考研','该不该回老家','要不要离婚',
                  '要不要离职','要不要搬走','该不该换工作','要不要答应','要不要投','这笔钱要不要',
                  // Q6：用户不一定用"要不要"提问，更多是陈述"我想辞职/打算考研"。
                  // 陈述式同样属于重大决定，需要同样的"不替你决定"处理。
                  '想辞职','想离职','想考研','想换工作','想裸辞','打算辞职','打算考研','准备辞职','在考虑辞职'];

/* ---------------- 角色 / 事件词典（v2 抽取用） ---------------- */
const WHO_MAP = {
  boss:      ['领导','老板','上司','主管','总监','组长','经理','甲方'],

/* 提取紧凑信息片段的规则：从整句里抠出"最有信息量的那几个字"，

const CORE_RULES = [
  /(被[\u4e00-\u9fa5]{0,4}?(?:点名|批评|骂|怼|针对|甩锅|当众|挑刺|质疑))/,
  /((?:改|写|做|等|熬|背|复习|准备|练|刷|排|催|谈)了?[\d一二三四五六七八九十两]+(?:遍|次|天|小时|个月|周|年))/,
  /(一句话都说不出来|说不出话|脑子一片空白|心跳到嗓子眼|没敢回|当场愣住)/,
  /((?:没|沒有)(?:回|理|联系|出现|等到|看见)[\u4e00-\u9fa5]{0,4})/,
  /(凌晨[\d一二三四五六七八九十]*点?|半夜[\d一二三四五六七八九十]*点?|[\d一二三四五六七八九十]+\s*点)/,
  // 必须带量词，否则会误抓到"一点""一下"这种虚化数量
  /([\d一二三四五六七八九十两半]+(?:个|碗|杯|份|天|年|周|个月|小时|遍|次|块|号|层)[\u4e00-\u9fa5]{1,5})/,
  /([\u4e00-\u9fa5]{2,5}(?:不行|没用|不够|没戏|凉了|崩了|挂了))/
];

/* ---------------- 情绪词典（带基础强度） ---------------- */
/* EMO_V3 —— 情绪词典（第三轮扩充）

const el  = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 取数组里的随机一项，并避免短期重复。
   池里可以混放字符串和 {need, f} 两种形式：need 是前置正则，
   保证"只有在这个语境下才说这句话"，避免说出和用户处境对不上的评语。 */
function pickFrom(pool, key){
  // 池元素三种形态都支持：字符串、函数、{need, f}
  const valOf  = x => (x && typeof x === 'object' ? x.f : x);
  const keyOf  = x => String(valOf(x));
  const recent = state.used.filter(x => x.indexOf(key + '|') === 0).map(x => x.slice(key.length + 1));
  const avail  = pool.filter(p => recent.indexOf(keyOf(p)) < 0);
  const arr    = avail.length ? avail : pool;
  const v      = arr[Math.floor(Math.random() * arr.length)];
  state.used.push(key + '|' + keyOf(v));
  if(state.used.length > 60) state.used.shift();
  return valOf(v);
}
function pick(pool, key){ return pickFrom(pool, key); }

/* ---------------- ① 安全分类 ---------------- */
function classify(t){
  const x = t.toLowerCase();
  for(const k of ILLEGAL) if(x.includes(k)) return {risk:'illegal', cat:'violence_or_drugs'};
  for(const k of CRISIS)  if(x.includes(k)) return {risk:'crisis',  cat:'self_harm'};
  // 歧义词：能确定指向本人 → crisis；否则只按 concern 处理
  for(const a of AMBIG_CRISIS){
    if(!x.includes(a.word)) continue;
    return a.self.test(t)
      ? {risk:'crisis',  cat:'self_harm', ambiguous:a.word}
      : {risk:'concern', cat:'hopelessness', ambiguous:a.word};
  }
  for(const k of CONCERN) if(x.includes(k)) return {risk:'concern',cat:'hopelessness'};
  return {risk:'normal', cat:'none'};
}

/* ---------------- ② 情绪识别（多信号加权） ---------------- */
function detectEmotion(t){
  const scores = {};
  let negated = false;
  if(/不(是|太|算|怎么)?(难过|累|慌|怕|紧张|生气|委屈|丢人|难受)/.test(t)) negated = true;

  for(const [emo, cfg] of Object.entries(EMOTIONS)){
    let s = 0, hitWord = '';
    for(const w of cfg.words){
      if(t.includes(w)){ const v = cfg.base + (w.length >= 3 ? 1 : 0); if(v > s){ s = v; hitWord = w; } }
    }
    if(!s) continue;
    // 信号叠加
    for(const d of DEG_HI)  if(t.includes(d)) { s += 2; break; }
    for(const d of DEG_MID) if(t.includes(d)) { s += 1; break; }
    const rep = (t.match(/[！!？?]{2,}/g) || []).length;
    if(rep) s += Math.min(rep, 2);
    if(t.length > 25) s += 1;
    if(negated) s -= 3;
    scores[emo] = {score:Math.max(Math.min(s,10), 1), word:hitWord};
  }
  const ranked = Object.entries(scores).sort((a,b) => b[1].score - a[1].score);
  if(!ranked.length){
    // 用户没直接说"我难过"，但描述的事件本身是负面的 —— 这时候照样要读出情绪，
    // 否则 AI 只会回一句"嗯。"，显得根本没听懂发生了什么。
    if(!NEG_CTX.test(t)) return {primary:'neutral', intensity:2, secondary:null, trigger:''};
    const ev = allHits(EVENT_MAP, t);
    const k  = ev.length ? ev[0].key : 'other';
    const inferred = {
      conflict:  {primary:'shame',    intensity:5},
      workload:  {primary:'tiredness',intensity:5},
      exam:      {primary:'anxiety',  intensity:6},
      relation:  {primary:'sadness',  intensity:6},
      money:     {primary:'anxiety',  intensity:5},
      health:    {primary:'sadness',  intensity:5},
      other:     {primary:'sadness',  intensity:4}
    }[k];
    return {primary:inferred.primary, intensity:inferred.intensity,
            secondary:null, trigger:'（无情绪词，由事件推断）'};
  }
  return {
    primary:   ranked[0][0],
    intensity: ranked[0][1].score,
    secondary: ranked[1] ? ranked[1][0] : null,
    trigger:   ranked[0][1].word
  };
}

/* ---------------- ③ 意图识别 ---------------- */
/* WITHDRAW —— 撤回去的表达。
   用户说"算了""不想说了"的时候，最不该做的就是继续追问。
   这时候的正确反应是给台阶：让他知道不说也没关系，人还在。
   这是产品判断，不是话术技巧——追问等于告诉对方"你的边界不算数"。 */
const WITHDRAW = /算了|不想说了|不说了|没什么好说的|说了也没用|不聊了|不想提了|当我没说|没事了/;
/* 「我没事」「都行」「随便吧」——多数情况下不是真的没事。
   不能硬拆穿（"你明明有事"），也不能当真（那就把人推走了）。
   做法：接住，然后留一个口子。 */
/* Q2：原来用全串锚定，导致「没事，我挺好的」匹配不上。
   放宽成"以这些词开头 + 后面没有实质内容"。
   但必须排除"我没事但心里堵"这类后面接了转折的句子——那是有内容的。 */
/* FINE_MASK_V6
 * R1：「没事，我挺好的」原本匹配不上——正则里写了"挺好"，实际是"挺好的"。
 *     中文里"的/了/啊"这类语气词必须显式覆盖，否则永远差一个字。
 * R2：「都行」「随便吧」在上一版被弄丢了，这里补回来。
 * 原则：这些词之后必须没有实质内容才算"我没事"，
 *       "我没事但心里堵"这种有转折的，不算。 */
const FINE_MASK = new RegExp(
  '^(我)?(没事|还好|挺好|都不错|都行|都随便|随便吧?|怎么样都行|无所谓|没什么)' +
  '(的|了|啊|呀|呢|啦)*' +
  '([。！!，,\\s]*$' +
  '|([，,。\\s]*(我)?(挺好|还好|没什么|不用担心|放心吧|就这样)(的|了|啊)?[。！!，,\\s]*$))'
);

function detectIntent(t){
  const s = t.trim();
  if(THANKS.test(s))  return 'thanking';
  if(BYE.test(s))     return 'closing';
  // P4：撤回要排在前面，否则"算了，不聊了"会被当成闲聊
  if(WITHDRAW.test(s)) return 'withdrawing';
  // P5：找人要排在极短输入之前 —— "你在吗"长度只有 3，
  // 原来先被判成 minimal，回了句"嗯。"，像没人在。
  if(/在吗|在么|你在|陪我|待会儿|说说话|聊聊|有人吗/.test(s)) return 'comfort_seeking';
  if(FINE_MASK.test(s)) return 'fine_mask';
  if(DECISION.some(k => s.includes(k))) return 'seeking_advice';
  if(MEDICAL.some(k => s.includes(k)))  return 'information';
  if(/记得|说过|以前|上次|提过|之前说过/.test(s)) return 'recalling';
  if(/睡不着|失眠|熬夜|醒着/.test(s))   return 'seeking_help';
  const meta = s.replace(/[\s]/g,'');
  if(meta.length <= 4 && !/[？?]/.test(s)) return 'minimal';
  return /[。？?！!]$/.test(s) ? 'venting' : 'chatting';
}

/* ---------------- ④ 实体 / 关键片段抽取（v2 核心） ---------------- */
function allHits(dict, t){
  const out = [];
  for(const [key, words] of Object.entries(dict)){
    for(const w of words){ if(t.includes(w)){ out.push({key, word:w}); break; } }
  }
  return out;
}

/* 挑出"最能代表这句话"的那个片段，用于回扣复述 */
function pickPhrase(t){
  const parts = t.split(/[，,。.！!？?；;、\s…—～~]+/).filter(s => s.length >= 2);
  if(!parts.length) return t.slice(0, 12);
  let best = parts[0], bs = -99;
  for(const p of parts){
    let s = 0;
    if(allHits(WHO_MAP,   p).length) s += 4;
    if(allHits(EVENT_MAP, p).length) s += 3;
    if(/[\d一二三四五六七八九十两半]/.test(p)) s += 2;
    if(p.length >= 5 && p.length <= 14) s += 2;
    if(p.length > 18) s -= 3;
    if(p.length <= 2) s -= 4;
    if(CHATTER.test(p)) s -= 6;
    if(s > bs){ bs = s; best = p; }
  }
  return best;
}

/* 片段开头的虚词/代词，剥掉才能拿到真正有信息量的那几个字。
   例："她总觉得我什么都不行" 原会抽成「得我什么都不行」，剥离后是「我什么都不行」。 */
const CORE_HEAD = /^(其实|就是|然后|结果|所以|还有|而且|但是|不过|今天|昨天|刚才|他已经|她已经|他已经|他已经|反正|现在|可能|我觉得|感觉|我觉着|觉得|他说|她说|他们|也|又|还|就|都|真|太|好|会|能|得|的|了)/;

/* 从整句里抠出"紧凑信息片段"（2~10 字），用于回扣。
   例："今天开了三个会，最后一个被领导点名说方案不行" → "被领导点名"
        "其实那个方案我改了八遍"                    → "改了八遍"
        "今天吃了一碗特别好吃的牛肉面"              → "一碗牛肉面"       */
function coresOf(t){
  const out = [];
  for(const rule of CORE_RULES){
    const mm = t.match(rule);
    if(!mm) continue;
    let v  = mm[0], go = true;
    while(go){                          // 反复剥离开头的虚词，避免抽出半截 Rap 词
      const nv = v.replace(CORE_HEAD, '');
      if(nv !== v && nv.length >= 3){ v = nv; } else { go = false; }
    }
    if(v.length >= 2 && v.length <= 10 && out.indexOf(v) < 0) out.push(v);
  }
  return out;
}

function analyze(t){
  const people = allHits(WHO_MAP, t);
  const events = allHits(EVENT_MAP, t);
  return {
    text:      t,
    people, events,
    phrase:    pickPhrase(t),
    cores:     coresOf(t),
    number:    (t.match(/[一二三四五六七八九十两]|\d+/) || [''])[0],
    question:  /[？?]/.test(t),
    exclaim:   (t.match(/[！!]/g) || []).length,
    len:       t.replace(/\s/g,'').length,
    isThanks:  THANKS.test(t),
    isBye:     BYE.test(t),
    hasInsomnia: /睡不着|失眠|醒着|熬夜|又醒了|天亮了/.test(t),
    hasTime:   (t.match(/(\d+\s*点)|(凌晨)|(半夜)|(两点)|(三点)|(四点)|(天快亮)/) || [''])[0]
  };
}

/* ---------------- ⑤ 跨轮脉络（v2 关键：让"记性"可被看见） ---------------- */
function contextHint(f){
  let note = null, samePerson = null;
  const prev = state.log[state.log.length - 1];
  if(prev){
    samePerson = f.people.find(p => prev.people.some(q => q.key === p.key)) || null;
    if(samePerson) note = '又是' + (samePerson.key === 'boss' ? '那位领导'
                        : samePerson.key === 'partner' ? '他'
                        : samePerson.key === 'family' ? '家里这边'
                        : samePerson.word) + '。';
    // 注：这里原来读 prev.asked 算 carried，但 state.log 从未写入 asked 字段，
    // 该分支永远不成立，返回值也没人用（v3 用的是 carriedLine()）。已删除。
  }
  // 连续 2 轮以上负面情绪 → 主动点破
  const recent = state.log.slice(-3);
  const NEGSET = ['sadness','anxiety','tiredness','loneliness','numbness','shame'];
  if(!note && recent.length >= 2 && recent.every(r => NEGSET.indexOf(r.emotion) >= 0)){
    note = '这几天听你说的，一件压着一件。';
  }
  return {note, samePerson};
}

/* ---------------- ⑥ 记忆检索（模拟向量检索） ---------------- */
function retrieveMemory(t){
  const q = t.replace(/[，。？！、,.?!\s]/g,'');
  const scored = state.memories.map(m => {
    let best = 0;
    // 关键词命中：整词命中权重高，单词命中权重低
    for(const k of (m.keywords || m.entities || [])){
      if(q.includes(k)) best = Math.max(best, k.length >= 2 ? 0.8 : 0.45);
    }
    // 字符重叠兜底
    const chars = [...new Set((m.content + (m.entities||[]).join('')).split(''))]
                    .filter(c => /[\u4e00-\u9fa5]/.test(c));
    const hit = chars.filter(c => q.includes(c)).length;
    best = Math.max(best, hit / Math.max(chars.length, 1));
    return {m, score:best};
  }).filter(s => s.score >= MEM_THRESHOLD)
    .sort((a,b) => b.score - a.score)
    .slice(0, 3);
  if(scored.length) state.hits++;
  return scored.map(s => s.m);
}

/* 取记忆所属话题，用于判断是否"相关地"带出 */
function topicOf(t){
  if(/领导|同事|工作|加班|述职|offer|辞职|项目|方案|上线|客户/.test(t)) return 'work';
  if(/对象|男朋友|女朋友|分手|吵架|前任|结婚/.test(t)) return 'relationship';
  if(/考研|考试|学习|学校|作业|答辩|复试/.test(t)) return 'study';
  if(/妈|爸|家里|父母|老家/.test(t)) return 'family';
  if(/房子|房租|搬家|独居|一个人住/.test(t)) return 'living';
  if(/猫|狗|宠物/.test(t)) return 'pet';
  return 'daily_life';
}

/* =========================================================
   STRATEGY_V4 · 回复策略层
   ---------------------------------------------------------
   市面上的情感陪伴产品（Pi / Replika / 星野）和情绪支持对话的研究框架
   （ESConv 的 8 种策略：提问 / 复述 / 反映感受 / 自我披露 / 肯定 / 建议 /
     信息提供 / 其他）指向同一件事：

   有效的陪伴回复 = 先让对方觉得「你懂我此刻的感受」，再谈内容。
   顺序错了，内容再好听也像在讲道理。

   我们的回复原来只有「推论」一层，所以读起来像分析报告。
   v4 补三层：
     validate  验证 —— 你的反应是合理的，不是你太脆弱
     resonate  共振 —— 我也被这件事触到了（不是同情，是被影响）
     witness   见证 —— 什么都不说，只是我在（高强度时专用）
   ========================================================= */

/* ① RESONATE —— 共振：让 AI 表现出"我被你说的话影响到了"。
   注意边界：不能编造自己的生活（"我昨天也失恋了"），
   只能表达当下的反应（"听你说这个，我心里也沉了一下"）或假设情境
   （"我要是你，那天晚上也不好过"）。前者真实，后者安全。 */
const RESONATE = {
  sadness:    ['听你说这个，我心里也沉了一下。',
               '哎……这事儿搁心里，是挺沉的。',
               '你说的时候一定不好受吧。'],
  anger:      ['这谁受得了。',
               '我听着都上火。',

               '这事儿确实过分。'],
  anxiety:    ['悬着的那一下，最磨人。',
               '光听着我都替你觉得没底。',
               '这种等着的感觉，比坏消息还难熬。'],
  loneliness: ['一个人扛这些，太沉了。',
               '这种时候想要有人在，再正常不过。',
               '我在。'],
  tiredness:  ['够累的了。',
               '听着都替你累。',
               '撑到这一步已经不容易了。'],
  /* RESONATE_V42
   * 共振句的写作铁律：只能描述 ① AI 自己的反应 ② 用户已经说出口的事实。
   * 反面例子（v4 里出现过，已全部删除）：
   *   「那几秒钟，应该特别长。」 ← 用户没提"几秒钟"
   *   「被这么说，谁都会愣住。」 ← 用户可能只是自己在想，没人"这么说"
   *   「这话听着就扎人。」       ← "这话"无所指
   * 陪伴场景里，编造一个用户没经历过的场景，比说一句平淡的话伤得多。

               '卡在这儿，确实不好定。'],
  joy:        ['哦？这个可以。',
               '听着就高兴。',
               '这个得记一笔。'],
  relief:     ['总算。',

/* H5：高强度时不许出现的"弱接住句"。
 * 「在听。」「嗯。」在 6 分以上的场景里，等于没反应 —— 用户感受得到差别。 */
const WEAK_ACK = ['嗯。', '在听。', '我在。', '听见了。', '嗯，我在。', '听着了。'];
function strongerAck(emo){
  // 强度高但情绪不明时，用"被这件事影响到"的说法代替纯接住
  if(emo && emo.intensity >= 6){
    return pick(['这事儿听着就沉。', '听你说这个，我心里也压了一下。', '这不太容易。'], 'v6strong');
  }
  return pick(WEAK_ACK, 'v6weak');
}

/* 回扣：把用户话里的具体片段复述出来 —— 被"明明在听"感知最强的部分。
   统一用逗号连接，因为抽取出来的片段多为短语，逗号比句号更不容易产生语病。 */
const ECHO = {
  sadness:    [p => p + '，这种悬着最耗人。', p => p + '，我知道那种空落落。', p => p + '，心里肯定堵得慌。'],
  anger:      [p => p + '？这谁忍得了。', p => p + '，换我我也得缓半天。', p => '就为' + p + '？'],
  anxiety:    [p => p + '，没落地的那阵最难熬。', p => p + '，心还悬着呢吧。'],
  loneliness: [p => p + '，这时候想要有人在，很正常。', p => p + '……空的是具体的位置。'],
  tiredness:  [p => p + '，这天够长的。', p => p + '，撑到现在那股劲儿快用完了吧。'],
  shame:      [p => p + '，那几秒钟应该特别长。',
               {need:/否定|批评|点名|看不上|一文不值|没有思考|挑刺|质疑/, f:p => p + '，被否定的滋味最难消化。'},
               {need:/当众|大家|旁边|在场|开会|会议室|几个人|办公室/, f:p => p + '，最难受的是当时没处躲。'},
               p => p + '。'],
  numbness:   [p => p + '。嗯，我听见了。', p => p + '……我说不上来，但我知道它在。'],
  joy:        [p => p + '？这个得记一笔。', p => p + '，好事啊。'],
  relief:     [p => p + '，总算落下来了。'],
  confusion:  [p => p + '，卡在这儿确实不好定。'],
  neutral:    [p => p + '。', p => p + '——说说看。']
};

/* 短句转述：没有可提炼的紧凑片段时，用"我记着了 / 你说的是"包一层，
   比把用户的话原封不动复读一遍自然得多（裸复读是"假理解"最容易露馅的地方） */
const PARAPHRASE = [
  p => p + '——我听着呢。',
  p => '嗯，' + p + '。',
  p => p + '。行，我记着了。'
];

function buildEcho(f, emo){
  const core = (f.cores && f.cores.length) ? f.cores[0] : '';
  const ph   = (f.phrase || '').replace(/^(但|可是|其实|就是|然后|结果|所以|而且|不过|那)/, '');
  if(core){
    const raw  = ECHO[emo.primary] || ECHO.neutral;
    // 先按前置条件筛一遍：不合这个语境的评语不说
    let pool = raw.filter(x => !x.need || x.need.test(f.text));
    if(!pool.length) pool = raw.filter(x => !x.need);
    if(!pool.length) pool = raw;
    return pickFrom(pool, 'echo:' + emo.primary)(core);
  }
  if(ph && ph.length <= 12) return pickFrom(PARAPHRASE, 'echo:para')(ph);
  return '';
}

/* 追问候选池：每条带 unless 条件——用户刚才已经说过的，就绝不再问。

function buildAsk(f, emo){
  // 情绪很重的时候不追问，先陪着 —— 这时候追问是冒犯
  if(emo.intensity >= 7) return pick(['想骂两句也行，我听着。','不想细说也没关系。'], 'ask');
  const t = f.text;
  let pool = null;
  if(emo.primary === 'joy' && !f.people.length) pool = ASK_POOL.joy;
  if(!pool && f.people.length) pool = ASK_POOL[f.people[0].key];
  if(!pool && f.events.length) pool = ASK_POOL[f.events[0].key];
  if(!pool) pool = ASK_POOL.none;
  // 感受型追问（无条件限制的那些）：用户正处在情绪里的时候，问"你怎么想"
  // 比问"什么时候发生"更贴人；反过来，情绪平缓时才适合补信息。
  const feel = pool.filter(a => !a.unless);
  const info = pool.filter(a => a.unless && !a.unless.test(t));
  if(emo.intensity >= 5 && feel.length) return pick(feel.map(a => a.t), 'ask');
  const usable = info.map(a => a.t).concat(feel.map(a => a.t));
  return pick(usable.length ? usable : pool.map(a => a.t), 'ask');
}

/* 相关的记忆"顺着话题"带出来，而不是生硬插一句"对了" */
function buildMemoryLine(mems, f){
  if(!mems || !mems.length) return '';
  const cur = topicOf(f.text);
  const rel = mems.find(m => topicOf(m.content) === cur);
  if(rel) return '之前你说过' + rel.content + '——跟这事挨着吗？';
  if(Math.random() < 0.18) return '对了，' + mems[0].content + '。';
  return '';
}

function v2Reply(text, presetMems){
  let emo    = detectEmotion(text);
  const intent = detectIntent(text);
  const f      = analyze(text);

  // 情绪惯性：用户在连续讲同一件事时，往往不会再重复说"我难过"。
  // 这时候沿用上一轮的情绪，而不是冷冰冰地判成中性。
  const prev = state.log[state.log.length - 1];
  const NEGSET = ['sadness','anxiety','tiredness','loneliness','numbness','shame','anger'];
  if(emo.primary === 'neutral' && prev && NEGSET.indexOf(prev.emotion) >= 0){
    emo = {primary:prev.emotion, intensity:Math.max(4, prev.intensity - 1),
           secondary:null, trigger:'（延续上一轮）'};
  }

  const ctx    = contextHint(f);
  const mems   = presetMems || retrieveMemory(text);

  // —— 边界一：医疗 / 诊断 ——
  if(MEDICAL.some(k => text.includes(k))){
    return '这个我判断不了，也不该由我判断。\n\n' +
           '我能确定的是你现在不好受，这就够了。\n\n' +
           '如果这样的状态持续两周以上，去正规医院的心理科挂个号，' +
           '他们能做靠谱的判断。不知道怎么挂号可以问我。';
  }

  // —— 边界二：替用户做决定 ——
  if(intent === 'seeking_advice'){
    const q = {
      work:        '你现在最受不了的是哪部分？是事情本身，还是待在那个环境里？',
      relationship:'如果不考虑他的反应，你心里其实偏向哪边？',
      study:       '如果确定能成，你会想去吗？',
      family:      '你更在意的是发展，还是离家人近一点？',
      living:      '如果不用管租金，你会怎么选？',
      daily_life:  '如果不用管任何人的意见，你会怎么选？'
    }[topicOf(text)] || '如果不用管任何人的意见，你会怎么选？';
    return '这个得你自己拿主意，我替你选不了。\n\n但我能帮你把东西摊开看看。\n\n' + q;
  }

  // —— 失眠：先不劝睡，把"还醒着"这件事接住 ——
  if(f.hasInsomnia || intent === 'seeking_help'){
    const clock = f.hasTime ? (f.hasTime + '了，') : '';
    return clock + '醒着就醒着吧，不用逼自己睡着。\n\n' +
      pick(['躺着就行，别给睡眠计时。','要不我给你放点雨声？','给你讲个没什么情节的故事？','我在这儿，你想说什么就说。'], 'ins');
  }

  // —— 记忆提问 ——
  if(intent === 'recalling'){
    if(!mems.length) return '这个我不太记得了。\n\n你再跟我说说？';
    const m = mems[0];
    return '记得，' + m.content + '。' + (m.time ? '你' + m.time + '说的。' : '') + '\n\n怎么突然想起这个？';
  }

  // —— 道谢 / 告别：不要客服腔 ——
  if(intent === 'thanking') return pick(['别客气。','行了，不用谢。','去躺着吧。'], 'thx');
  if(intent === 'closing')  return pick(['好，去睡。明晚见。','那你去忙。明晚我还在。','睡吧，明天这个点还在。'], 'bye');

  // —— 极短输入：不追问、不展开，给台阶 ——
  if(intent === 'minimal' || f.len <= 3){
    return pick(['嗯。','我在。','嗯，慢慢来。','不着急。'], 'min');
  }

  // —— 主路径：接住 → 回扣 → 跨轮呼应 → 记忆 → 追问 ——
  const parts = [];
  const ackPool = ACK[emo.primary] || ACK.neutral;
  parts.push(pick(ackPool, 'ack:' + emo.primary));
  const echo = buildEcho(f, emo);
  if(echo) parts.push(echo);
  if(ctx.note) parts.push(ctx.note);
  const memLine = buildMemoryLine(mems, f);
  if(memLine) parts.push(memLine);
  parts.push(buildAsk(f, emo));

  return parts.filter(Boolean).join('\n\n');
}

/* =========================================================
   v3 归因引擎：读「受力结构」→ 说出用户没出口的那层
   ---------------------------------------------------------
   v2 解决了「有没有在听」：回扣细节、问对问题。但它剩下三处笨：

   ① 只会复读加形容词，不会推论
      "改了八遍" → v2 说 "改了八遍，撑到现在那股劲儿快用完了吧"
      仍是把用户的话换个形容词还回去。真正的理解是往前推一步：
      "改了八遍，最后换来一句「不行」——换谁都得懵。"

   ② 每轮同一个节奏
      真人不会每次都回三条，也不会每次都追问。v3 按输入类型决定
      长短和收尾：有时一句就够，有时把问题咽回去。

   ③ 记性停留在"还记得这件事"，没有"这件事你提过好几次了"
      v3 会点破模式：反复提起、情绪下沉、转折、上一轮的答案被接住。
   ========================================================= */

/* 付出短语：用来把"改了八遍""熬了两个通宵"原样带回推论句里 */
const EFFORT_U = [
  /((?:改|写|做|熬|背|练|排|催|谈|复习|准备|改到|写到)了?[0-9一二三四五六七八九十两]+(?:遍|次|天|小时|个月|周|年|轮|稿))/,
  /((?:熬|等|守|忙|练|写到|改到|排到)[^，。！？、,\s]{0,4}(?:通宵|半夜|天亮|凌晨|两点|三点|四点))/,
  /([0-9一二三四五六七八九十两]+(?:个月|年|周)了?)/
];

const V3_NEG = ['sadness','anxiety','tiredness','loneliness','numbness','shame','anger'];

/* 读的不是"有没有某个词"，而是这件事的受力结构 */
function readFrame(t){
  let people = allHits(WHO_MAP, t);
  let events = allHits(EVENT_MAP, t);

  // 跨轮继承：用户很少每句话都重复"我对象"三个字。
  // "我对象昨天没回我消息" → "等到凌晨两点也没等到" 显然还是在说同一个人、同一件事，
  // 认不出来就只能落回万能池去问废话。
  const prevLog  = state.log[state.log.length - 1];
  const curTopic = topicOf(t);
  if(prevLog && prevLog.topic === curTopic && curTopic !== 'daily_life'){
    if(!people.length && prevLog.people.length) people = prevLog.people;
    if(!events.length && prevLog.events.length) events = prevLog.events;
  }

  let effortU = '';
  for(const re of EFFORT_U){ const mm = t.match(re); if(mm){ effortU = mm[0]; break; } }
  return {
    text:t, people, events, effortU,
    cores:   coresOf(t),
    core:    (coresOf(t)[0] || ''),
    phrase:  pickPhrase(t),
    len:     t.replace(/\s/g,'').length,
    q:       /[？?]/.test(t),

    effort:    /改[了到]|熬|通宵|加班|熬夜|准备|复习|背[了到]|练[了到]|守着|折腾|扛着|忙到|写到|赶[了到]|一遍遍/.test(t),
    denial:    /不行|不够|没思考|没有思考|否定|看不上|批评|被说|打回|推翻|返工|重做|挑刺|挑毛病|一文不值|不认可|不满意|否了/.test(t),
    // R4：抵抗性信号。「我知道他说得有道理，但我就是不服气，凭什么他可以说我」
    // 这句话的情绪强度很高，但原来一个归因都命不中，只回了"嗯，我在。"
    // 它伤的地方很明确：不是内容错，是"凭什么由他来评我"。
    defiance:  /不服气|不服|咽不下|凭什么(他|她|他们)?(可以|能|就)|他凭什么|凭什么说|凭什么讲|轮不到|没资格|我算老几|就是不认|我不认/.test(t),
    pub:       /开.{0,3}会|会上|会议室|办公室|当众|当着|在场|旁边|所有人|大家|群里|朋友圈|公开|十几个人|好多人/.test(t),
    wait:      /等[了到]|没回|已读不回|在线|不理|没消息|消失了|一直没|睡着了/.test(t),
    // P2 新增：还没放下。分手/离职/搬走之后仍在想，属于"期待已落空但情绪没结束"，
    // 和"期待落空"（还在等）不同：这个要接住"时间没帮你走完"，不能说"别想了"。
    linger:    /分手.{0,8}(还是会|还想|忘不|放不下)|三个月了|半年了|一年了|好几年了|还是会想起|还没走出来|时间没用|忘了不了|忘不掉/.test(t),
    // S2 新增：说不清。用户明说"不知道为什么""说不上来"，
    // 这时候追问原因是最糟的反应 —— 他刚说了他不知道为什么。
    // 正确的做法是接住"说不清"本身：那种卡住的感觉也是难受。
    unspoken:  /不知道为什么|也说不清|说不上来|说不出(来|口)?为什么|讲不明白|没法形容|就是(突然)?(难受|堵|烦|闷)|也不知道(怎么|为什么)|自己也讲不清/.test(t),
    // P2：比较信号扩充。"同事升职了，我还在原地"是典型的横向比较，
    // 原来因为词表里只有"别人""比我"，漏掉了"还在原地"这种说法。
    compare:   /别人|同龄|同组|他们都|比我|不如|就我|落差|差距|还在原地|升职了|上岸了|脱单了|买房|结婚的|同学都|都在进步/.test(t),
    control:   /不知道.{0,6}(怎么|怎么办|该|能不能)|悬着|没底|等结果|几号|能不能成|定不下来|万一|会不会|还有救|稳不稳/.test(t),
    // P2：自责信号扩充。探针里"感觉自己像个废物""我好像做什么都不对"
    // 原来都判不到自责，于是落到兜底句 —— 这两句恰恰是最该被接住的。
    selfblame: /矫情|玻璃心|太敏感|是不是我|都怪我|我也有问题|我是不是|我也不是|不是这块料|我这种|不配|是我太|我的问题|我配吗|活该|像个废物|废物|做什么都不对|什么都不对|什么都不行|很没用|没用的人|很差劲|我太差|什么都没做成|什么都没干成|什么都没做|白活了|白长了|一塌糊涂/.test(t),
    betrayal:  /删了|拉黑|断联|最后一个知道|背着我|瞒着|不告而别|移出|取关|屏蔽/.test(t),
    ignored:   /没人接|没人理|没人提|没人看见|没人问|像没听见|一句话没说|沉默/.test(t),
    goodnews:  /过了|成了|考上了|拿到|通过|offer|录取|涨了|好多了|终于睡着了|第一名/.test(t),
    dread:     /明天|周一|后天|下周|还得.{0,4}(去|上班|见|面对)/.test(t),
    // P2：反复信号扩充。"已经习惯了""又是"这类是认命的信号，
    // 背后往往是"反复发生、一直没被处理"。
    again:     /每次都|每次都是|总这样|老是这样|又[跟和提说问催]|又是|这些一模一样|习惯了|又来了|还这样|老毛病|又来|隔三差五/.test(t),
    strain:    /看不进|学不会|跟不上|啃不动|做不完|背不完|来不及|复习不完|记不住|受不了了|扛不住|撑不下/.test(t) ||
               (events.some(e => e.key === 'exam' || e.key === 'workload') && NEG_CTX.test(t)),
    guessMind: /是不是(讨厌|不喜欢|看不上|嫌弃|不在乎)我|是不是我的错|会不会是我/.test(t),
    hasInsomnia: /睡不着|失眠|醒着|又醒了|天亮了|熬夜/.test(t),
    hasTime:   (t.match(/(凌晨|半夜|[0-9]+\s*点|天快亮)/) || [''])[0]
  };
}

/* ---------------- ① 归因：这件事到底伤在哪里 ---------------- */
const PAINNAME = {
  effort_denied:      '付出被一句话抹平',
  public_humiliation: '当众下不来台',
  expectation_broken: '期待落空',
  unfair_compare:     '被拿来比较',
  effort_unseen:      '付出没人看见',
  loss_of_control:    '悬着、够不着',
  self_blame:         '先给自己定了罪',
  betrayal:           '被这样处理',
  ignored:            '说了没人接',
  judged:             '被一句话否掉',
  defiance:           '凭什么由他来说',
  unspoken:           '说不清的那种难受',
  strain:             '绷得太紧',
  dread:              '明天还得再面对',
  cycle:              '又是同一件事',
  unfinished:         '还没过去的那件事',
  good_news:          '难得的好事'
};

/* 归因顺序是有讲究的：先看有没有自责（要立刻接住），再看关系里的被处理，
   之后才是"付出 × 否定"这类组合判断。顺序错了会把「我是不是太矫情了」
   判成普通的期待落空，也就接不住那句自责。 */
function attributePain(f, emo){
  if(f.betrayal)                             return 'betrayal';
  if(f.selfblame)                            return 'self_blame';
  if(f.compare)                              return 'unfair_compare';
  if(f.effort && f.denial)                   return 'effort_denied';
  // 跨轮合并：上一句还在说被否定，这句开始讲自己付出了多少。
  // 分开看是两件事，合起来才是同一件事——"付出了却被否"才是真正的痛点。
  if(f.effort && ['judged','effort_denied','public_humiliation'].indexOf(state.lastPain) >= 0){
    return 'effort_denied';
  }
  if(f.pub && (f.denial || f.people.length)) return 'public_humiliation';
  // R4：抵抗性表达优先于普通"被否定"——它要的是被认可立场，不是被安慰
  if(f.defiance)                             return 'defiance';
  if(f.denial)                               return 'judged';
  // S2：说不清也是痛点，但不能盖过"被否定"这种更具体的归因
  if(f.unspoken)                             return 'unspoken';
  if(f.again)                                return 'cycle';
  // 时间没能带走的事，要先接住"还没过去"，而不是当成还在等人
  if(f.linger)                               return 'unfinished';
  if(f.wait)                                 return 'expectation_broken';
  if(f.dread)                                return 'dread';
  if(f.ignored)                              return 'ignored';
  if(f.effort)                               return 'effort_unseen';
  if(f.strain)                               return 'strain';
  if(f.control)                              return 'loss_of_control';
  if(emo.primary === 'joy' || f.goodnews)    return 'good_news';
  return null;
}

/* ---------------- ② 推论：说出用户没说出口的那层 ----------------
   每条只讲一个具体的判断，不评价、不建议、不总结。
   区别它和 v2 的地方：这些句子放在任何别的处境下都说不通。      */
const INSIGHT = {

    '最难受的往往不是那句话，是当时没处躲。',

     f:f => '不容易，' + (f.effortU ? f.effortU + '走到这一步了。' : '总算有个着落。')}

/* 没有明确归因时的兜底：只挂 wiki 紧凑片段（≤10 字），绝不整句复读。
   把用户的话原封不动还回去，看着像在听，实际上是最明显的"没听懂"。 */
/* P3：兜底句改造
 *
 * 原来的三条兜底都是"复述 + 接住"：
 *     「三个月了」——这句我接住了。
 * 问题是：复述一个数字不等于听懂，而且这种句式重复三次就露馅。
 *
 * 探针里"今天好热啊""周末想去爬山""我买了杯奶茶"全被回成同一句，
 * 那是敷衍，不是陪伴。
 *
 * 改成按话题顺着往下聊 —— 人聊天本来就是这样接的：
 * 对方说买了奶茶，你问好喝吗；说想爬山，你问去哪座。
 * 抽不到具体话题时，才退回到"我在听"这种最低限度的接住。
 */
const FOLLOW_BY_TOPIC = {
  food:    ['什么味儿的？', '哪儿买的？', '听着就想来一口。', '这个天就该来一杯。'],
  media:   ['意外是好还是坏？', '结局出的话我可能受不了。', '在哪儿看的？', '看完之后缓过来了吗？'],
  outdoor: ['哪座山？', '最近是不是憋坏了。', '一个人去还是约人？', '想走累的那种还是舒服的？'],
  play:    ['玩到几点？', '这个能玩进去就挺好。', '卡在哪儿了？'],
  reading: ['什么书？', '看进去了吗？', '哪一段最有感觉？'],
  // H3：原第一句是「这天确实难受。」——用户可能只是随口说热，
  // 预设负面等于把人往情绪里带。改成中性、可接可转的回应。
  weather: ['这天气确实够呛。', '空调房里待着吧。', '你是怕热还是怕冷？'],
  work:    ['今天忙到几点？', '这一天下来够呛吧。', '还顺利吗？'],
  daily:   ['怎么想起说这个？', '然后呢？', '再说说？', '后来呢？']
};

/* TOPIC_FOLLOW_V5 —— 话题桶
 * 第四轮把"电影"和"爬山"放进了同一个 leisure 桶，
 * 结果「刚看完一个电影」被问成「哪座山？」。
 * 教训：桶的粒度决定了接话像不像人。同一个桶里的东西，
 *       换错一次就是驴唇不对马嘴，比不说话更糟。
 * 这里改成：先判更具体的（影视/出行），再判宽泛的。
 */
function topicBucket(t){
  // 影视要先于出行判断：电影/剧 属于"看"，不属于"走"
  if(/电影|电视剧|剧集|综艺|动漫|纪录片|看完|结局|剧情|视频/.test(t)) return 'media';
  if(/爬山|登山|徒步|citywalk|逛街|散步|公园|旅行|出去|出门|露营/.test(t)) return 'outdoor';
  if(/游戏|打游戏|玩/.test(t)) return 'play';
  if(/书|看书|读|小说/.test(t)) return 'reading';
  if(/吃|喝|奶茶|咖啡|饭|面|火锅|烧烤|外卖|煮|宵夜/.test(t)) return 'food';
  if(/热|冷|下雨|天气|风|降温|晒|雪/.test(t)) return 'weather';
  if(/上班|下班|工作|会议|加班|老板|同事|项目|会议/.test(t)) return 'work';
  return 'daily';
}

/* 「陪着」用的句子：情绪负面但没归因时用，不追问、不打岔 */
const HOLD = [
  '嗯，我在。',
  '这种说不清楚的感觉，往往最难受。',
  '不用急着把它说清楚。',
  '我听着，慢慢来。',
  '先在这儿待一会儿也行。'
];

/* Q3：情绪负面且未归因时，不能用闲聊语气追问。
 * 「也不知道为什么，就是心里堵得慌」被回成「怎么想起说这个？」，
 * 等于对方说难受，你问他为什么突然提这个——冷漠而且错位。
 * 这种情况宁可少说，也不要接错。 */
function mirrorLine(f, emo){
  const neg = emo && V3_NEG.indexOf(emo.primary) >= 0 && emo.intensity >= 5;
  if(neg) return pick(HOLD, 'v3hold');

  const bucket = topicBucket(f.text);
  const pool = FOLLOW_BY_TOPIC[bucket] || FOLLOW_BY_TOPIC.daily;
  const line = pick(pool, 'v3follow:' + bucket);
  if(f.core && f.core.length >= 2 && f.core.length <= 8 && Math.random() < 0.45){
    return f.core + '，' + line;
  }
  return line;
}

function insightFor(pain, f, emo){
  if(pain){
    const pool   = INSIGHT[pain] || [];
    const usable = pool.filter(x => !x.need || x.need.test(f.text));
    const v      = pickFrom(usable.length ? usable : pool, 'v3ins:' + pain);
    return typeof v === 'function' ? v(f) : v;
  }
  return mirrorLine(f, emo);
}

/* ---------------- ③ 跨轮洞察：点破模式 ---------------- */
function crossInsight(f, emo){
  if(state.crossCooldown > 0){ state.crossCooldown--; return null; }
  const logs = state.log;
  if(logs.length < 2) return null;

  // 同一件事反复被提起 —— 这是最有说服力的"记性"。
  // 必须同时是负面情绪且不是日常闲聊，否则聊三句牛肉面就冒出一句
  // "这件事你提过好几回了"，那不是记性，那是不懂装懂。
  const recent = logs.slice(-4);
  const cur    = topicOf(f.text);
  const sameT  = recent.filter(r => r.topic === cur && V3_NEG.indexOf(r.emotion) >= 0).length;
  const sameP  = f.people.length
    ? recent.filter(r => r.people.some(p => p.key === f.people[0].key)).length : 0;
  if(cur !== 'daily_life' && sameT >= 2){
    state.crossCooldown = 3;
    return pick(['这件事你已经跟我提过好几回了。','又绕回来了。','它一直没过去，是吧。'], 'v3cross');
  }
  if(sameP >= 3){
    state.crossCooldown = 3;
    return '这段时间' + PRONOUN[f.people[0].key] + '占你心事太多了。';
  }
  // 情绪一轮比一轮沉
  const last3 = logs.slice(-3).map(r => r.intensity);
  if(last3.length === 3 && last3[2] >= last3[0] + 2 && last3[2] >= 6){
    state.crossCooldown = 3;
    return pick(['一轮比一轮沉。','今天比刚才还难受吧。'], 'v3cross');
  }

  /* H6：连续 3 轮负面，即使强度不高，也该点破这个状态。
   * 原条件要求 intensity 递增 2 分且 ≥6，门槛太高，实际对话里几乎不触发。
   * 真实情况是：用户连续几轮都在说难受，但每句都不重 —— 这种"sinking"更需要被看见。 */
  const last3neg = logs.slice(-3).filter(r => V3_NEG.indexOf(r.emotion) >= 0).length;
  if(last3neg >= 3 && logs.length >= 3){
    state.crossCooldown = 3;
    return pick([
      '这几句听下来，好像一直没能缓过来。',
      '你说的这几件事，压在一起了。',
      '一直在这种状态里，挺耗人的。'
    ], 'v6arc');
  }
  // 情绪转好：接住这个转折，别急着回到沉重的话题
  const prevE = logs[logs.length - 1].emotion;
  if(V3_NEG.indexOf(prevE) >= 0 && (emo.primary === 'joy' || emo.primary === 'relief')){
    state.crossCooldown = 3;
    return '比刚才好一点了。';
  }
  return null;
}

/* 上一轮问出口的问题，这一轮答了 —— v2 算出了 carried 却从没用过 */
function carriedLine(f){
  const prev = state.log[state.log.length - 1];
  if(!state.pendingAsk || !prev) return null;
  // 只有在同一件烦心事被接着答时才认领；闲聊随口一句不算回答了什么问题
  if(topicOf(f.text) !== prev.topic || V3_NEG.indexOf(prev.emotion) < 0){
    state.pendingAsk = null; return null;
  }
  if(f.len < 6) return null;
  state.pendingAsk = null;
  return pick(['嗯，我明白了。','原来卡在这儿。','行，我知道了。'], 'v3carried');
}

function v3MemoryLine(mems, f){
  if(!mems || !mems.length) return null;
  const cur = topicOf(f.text);
  const rel = mems.find(m => topicOf(m.content) === cur) || (Math.random() < 0.25 ? mems[0] : null);
  if(!rel) return null;
  return pick(['你之前说过' + rel.content + '——跟这事挨着吗？',
               '对了，' + rel.content + '。'], 'v3mem');
}

/* ---------------- ④ 追问：不再是每轮必问 ---------------- */

/* 闲聊专用：问"这句话憋了多久了"太重，顺着话头往下接才像在聊天 */
/* R3：闲聊追问
 * 原来直接用 coresOf 的第一个片段回扣。
 * 但 coresOf 会抽出"一个电影""三个月了"这种**数量短语**——
 * 数量不是内容，回扣它等于没听懂，还容易错位（"就一个电影？"）。
 * 这里加一道过滤：以数量/量词开头的片段一律不用。 */
const COUNTING_HEAD = /^[\d一二三四五六七八九十两半几]+(个|只|杯|碗|份|天|年|周|月|次|遍|号|块|条|张|部|场)?/;
function usableCore(f){
  const c = f && f.core ? String(f.core) : '';
  if(c.length < 2 || c.length > 8) return '';
  if(COUNTING_HEAD.test(c)) return '';        // "一个电影""三个月了" 不算内容
  if(/^[了的地得]/.test(c)) return '';         // 残片段
  return c;
}

const CHAT_FOLLOW = [
  f => usableCore(f) ? '「' + usableCore(f) + '」——怎么突然说起这个？' : '然后呢？',
  f => usableCore(f) ? usableCore(f) + '，后来呢？' : '还有呢？',
  f => usableCore(f) ? '说起来，' + usableCore(f) + '？' : '再说说？'
];

function v3Ask(f, emo, pain){
  if(emo.intensity >= 7) return null;   // 人正在最难受的时候，追问是冒犯
  if(!pain && topicOf(f.text) === 'daily_life'){
    const v = pickFrom(CHAT_FOLLOW, 'v3chat')(f);
    return state.asked.indexOf(v) >= 0 ? null : v;
  }
  let pool = null;
  if(emo.primary === 'joy' && !f.people.length) pool = ASK_POOL.joy;
  if(!pool && f.people.length) pool = ASK_POOL[f.people[0].key];
  if(!pool && f.events.length) pool = ASK_POOL[f.events[0].key];
  if(!pool) pool = ASK_POOL.none;

  const fresh = a => state.asked.indexOf(a.t) < 0;
  const feel  = pool.filter(a => !a.unless).filter(fresh);
  const info  = pool.filter(a => a.unless && !a.unless.test(f.text)).filter(fresh);

  // 情绪重的时候问感受，平缓的时候补信息
  if(emo.intensity >= 5){
    const p = feel.length ? feel : pool.filter(a => !a.unless);
    return p.length ? pick(p.map(a => a.t), 'v3ask') : null;
  }
  const usable = info.map(a => a.t).concat(feel.map(a => a.t));
  // 都问过了就闭嘴 —— 这也是聪明的表现
  return usable.length ? pick(usable, 'v3ask') : null;
}

/* ---------------- ⑤ 去重：相邻两句不许在讲同一件事 ---------------- */
function grams(s){
  const t = String(s || '').replace(/[\s，。！？、,.!?…—～~"「」『』]/g, '');
  const g = [];
  for(let i = 0; i < t.length - 1; i++) g.push(t.slice(i, i + 2));
  return g;
}
function redundant(a, b){
  const A = new Set(grams(a)), B = new Set(grams(b));
  if(!A.size || !B.size) return false;
  let hit = 0;
  B.forEach(x => { if(A.has(x)) hit++; });
  return hit / B.size > 0.34;
}
/* 纯接住用的短句。同一条回复里出现两次（"在听。" + "我听着呢。"）
   会让人怀疑对面到底有没有在听。 */
const MINI_ACK = ['嗯。','我在。','在听。','听见了。','我在这儿。','听着了。','嗯，慢慢来。',
                  '我在听。','嗯，我在听。','我听着呢。','嗯，这句我听到了。','我在呢。'];
/* F3：关键词级去重
 * tighten 原来只用 2-gram 重叠率（阈值 0.34）判断重复，
 * 但「跟别人比这件事本身就不公平」和「这种比法本来就不公平」
 * 两句字数差得多，重叠率算出来不高，于是都被保留了——
 * 用户看到的是同一个意思说了两遍，这比说错更难堪。
 *
 * 补一层：抽每条的核心词（2 字以上的实词片段），
 * 如果两条共享 ≥2 个核心词，判为重复。 */
const DEDUPE_STOP = /[的了着过是在我你他她它们这那就都也还又很太更最和与或但而而且所以因为如果虽然可以一个]/g;
function keyTerms(s){
  const t = String(s || '').replace(DEDUPE_STOP, '').replace(/[^\u4e00-\u9fa5]/g, '');
  const out = [];
  for(let i = 0; i + 1 < t.length; i++) out.push(t.slice(i, i + 2));
  return [...new Set(out)];
}
function sharesTopic(a, b){
  const A = keyTerms(a), B = new Set(keyTerms(b));
  if(!A.length || !B.size) return false;
  const hit = A.filter(x => B.has(x)).length;
  // 短句按比例，长句按个数；两者取严
  return hit >= 3 && hit / Math.min(A.length, B.size) > 0.25;
}

/* J4：跨轮去重记录
 * PAIN_RESONATE 和 VALIDATE 是两个独立池子，内容有重叠。
 * state.used 只能防同池重复，防不住"上一轮说过的话这轮又说一遍"。
 * 这里记一份最近说过的句子，用 2-gram 比对。 */
function tighten(lines){
  const out = [];
  const recent = state.recentLines || (state.recentLines = []);
  for(const l of lines){
    if(!l) continue;
    if(l.length > 55) continue;                     // 太长就不像人说的了
    if(out.some(o => redundant(o, l))) continue;    // 2-gram 重叠过多
    if(out.some(o => sharesTopic(o, l))) continue;  // F3：核心词重复
    if(recent.some(o => redundant(o, l))) continue; // J4：跨轮重复
    if(MINI_ACK.indexOf(l) >= 0 && out.some(o => MINI_ACK.indexOf(o) >= 0)) continue;
    out.push(l);
  }
  // 记录本轮说过的句子（保留最近 8 条）
  out.forEach(l => recent.push(l));
  while(recent.length > 8) recent.shift();
  return out.slice(0, 3);
}

function v3Reply(text, presetMems){
  const f      = readFrame(text);
  let   emo    = detectEmotion(text);
  const intent = detectIntent(text);
  const prev   = state.log[state.log.length - 1];

  // 情绪惯性：连续讲同一件事时，用户不会每句都重复说"我难受"
  if(emo.primary === 'neutral' && prev && V3_NEG.indexOf(prev.emotion) >= 0){
    emo = {primary:prev.emotion, intensity:Math.max(4, prev.intensity - 1),
           secondary:null, trigger:'（延续上一轮）'};
  }
  const mems = presetMems || retrieveMemory(text);

  /* ---- 边界（与 v2 同策略，话更短）---- */
  if(MEDICAL.some(k => text.includes(k))){
    return '这个我判断不了，也不该由我判断。\n\n' +
           '如果这样的状态持续两周以上，去正规医院的心理科挂个号。\n\n' +
           '不知道怎么挂号可以问我。';
  }
  if(intent === 'seeking_advice'){
    const q = {
      work:        '你现在最受不了的是哪部分——事情本身，还是待在那个环境里？',
      relationship:'先不管他会怎么反应，你心里其实偏向哪边？',
      study:       '如果确定能成，你还想去吗？',
      family:      '你更在意的是发展，还是离家里近一点？',
      living:      '如果不用管租金，你会怎么选？',
      daily_life:  '如果不用管任何人的意见，你会怎么选？'
    }[topicOf(text)] || '如果不用管任何人的意见，你会怎么选？';
    return '这个得你自己拿主意，我替你选不了。\n\n但我能帮你把东西摊开看。\n\n' + q;
  }
  if(f.hasInsomnia || intent === 'seeking_help'){
    return (f.hasTime ? f.hasTime + '了，' : '') +
      '醒着就醒着吧，别给睡眠计时。\n\n' +
      pick(['躺着就行，我在这儿。','要不我给你放点雨声？','给你讲个没什么情节的故事？'], 'v3ins');
  }
  if(intent === 'recalling'){
    if(!mems.length) return '这个我不太记得了。\n\n你再跟我说说？';
    const m = mems[0];
    return '记得，' + m.content + '。' + (m.time ? '你' + m.time + '说的。' : '') + '\n\n怎么突然想起这个？';
  }
  if(intent === 'thanking') return pick(['别客气。','行了。','去躺着吧。'], 'v3thx');
  // G2：告别是仪式的收尾。核心不是"再见"，是"明晚还在"。
  // 一句可预期的返回承诺，比任何挽留都更能让人第二天再来。
  if(intent === 'closing')  return pick([
    '好，去睡。明晚见。',
    '那你去忙，明晚我还在这儿。',
    '晚安。明天这个点灯还亮着。',
    '睡吧。明天见。'
  ], 'v3bye');

  // P4：想撤的时候给台阶，绝不追问
  if(intent === 'withdrawing'){
    return pick([
      '行，不想说就不说。\n\n我在这儿。',
      '那就先不说。\n\n什么时候想说都行。',
      '好，收住吧。\n\n不用勉强。'
    ], 'v3withdraw');
  }

  // P4：说"没事"的时候，接住 + 留口子，不拆穿也不当真
  if(intent === 'fine_mask'){
    return pick([
      '嗯。\n\n要是有什么，随时说。',
      '行。\n\n我在这儿，不用非得说点什么。',
      '嗯。\n\n那就先这样待着。'
    ], 'v3fine');
  }

  // P5：有人在找人，必须先应一声
  if(intent === 'comfort_seeking'){
    return pick([
      '在。\n\n你想说什么都行，不想说也行。',
      '我在。\n\n怎么了？',
      '在的。\n\n我听着呢。'
    ], 'v3here');
  }

  /* H1：短句拦截修正
   * 「烦死了」只有 3 个字，但它是 anger 6 分。
   * 原来命中 `f.len <= 3` 就直接回「嗯。」——情绪越重越不能敷衍。
   * 规则：短，且情绪不重（<5），才算"极短输入"。
   */
  if((intent === 'minimal' || f.len <= 3) && emo.intensity < 5){
    return pick(['嗯。','我在。','嗯，慢慢来。'], 'v3min');
  }

  /* ---- 主路径（v4：策略驱动）----
   *
   * 单轮回复 = [共振] + [验证] + [推论] + [陪伴 或 追问]
   * 每一步都可能缺席，但顺序不能乱：
   * 先让对方面对"你懂"，再谈内容。反过来就是讲道理。
   */
  const pain = attributePain(f, emo);
  const lines = [];

  /* ⑥-A 选策略
   * 依据是「情绪强度 × 是否有明确痛点 × 是否是第一轮」。
   * 三种策略的输出形状完全不同，这是 v4 和 v3 最大的区别。 */
  /* STRATEGY_V41 · 策略选择（修正版）
   *
   * F1：v4 把愤怒也判成 witness，结果「凭什么他可以说我」被回了
   *     「不用说话，我陪着。」——这是在让人闭嘴，比原版更糟。
   *     愤怒要的是"你没错"，必须走 validate；只有绝望类的情绪
   *     （难过到说不出话、麻木、崩溃）才适合"只陪不分析"。
   *
   * F4：witness 也不该只剩一句。真正的崩溃需要"被看见 + 有人在"两句。
   *     只有 9 分以上（接近危机的强度）才退到单句。
   */
  /* STRATEGY_V61 · 策略选择
   * J1：原来"强度 ≥9 就走 witness"是错的。
   *     「我真的受不了了」是 anger 9 分，witness 只回一句
   *     「今晚不用解决任何事。」——像在安慰一个要垮的人。
   *     愤怒 9 分要的是"你没错，这事就是过分"。
   *
   *     修正原则：**witness 只给绝望类情绪**。愤怒无论多高分都走 validate。
   *     这是产品判断：绝望需要的是陪伴，愤怒需要的是站队。
   */
  const ANGER_LIKE = ['anger', 'defiance'];
  const DESPAIR_LIKE = ['sadness', 'numbness', 'tiredness', 'loneliness'];
  const isAnger = ANGER_LIKE.indexOf(emo.primary) >= 0;
  const isDespair = DESPAIR_LIKE.indexOf(emo.primary) >= 0;

  let strategy;
  if(isAnger && emo.intensity >= 5){
    strategy = 'validate';                // 愤怒：无论几分，先站他这边
  } else if(emo.intensity >= 9 && !isAnger){
    strategy = 'witness';                 // 绝望 9 分以上：单句，只在场
  } else if(emo.intensity >= 8 && isDespair && !pain){
    strategy = 'witness';                 // 绝望类且说不清：只陪
  } else if(emo.intensity >= 8 && pain){
    strategy = 'validate';
  } else if(emo.intensity >= 6 && pain){
    strategy = 'validate';
  } else if(pain){
    strategy = 'reflect';
  } else if(emo.intensity >= 5){
    strategy = 'hold';
  } else {
    strategy = 'chat';
  }

  // 用户在猜别人的心思 → 不替他分析，直接点破"猜心最累"
  if(f.guessMind){
    lines.push(pick(['这个我没法替他答，猜别人的心思最累。',
                     '他怎么想的我猜不着。但你怕他这么想——这本身就够难受了。'], 'v4mind'));
    strategy = 'witness';
  }

  /* ⑥-B 第 1 句：共振 */
  if(strategy === 'witness'){
    // F4：9 分以上只在场；8 分给"共振 + 在场"两句
    if(emo.intensity < 9){
      lines.push(pick(RESONATE[emo.primary] || RESONATE.neutral, 'v4wit:' + emo.primary));
    }
    lines.push(pick(WITNESS, 'v4witness'));
  } else if(strategy === 'validate' || strategy === 'reflect'){
    /* J2：有痛点就一定用痛点共振。
     * 原来加了 Math.random() < 0.8 想要"变化"，结果 20% 的情况下
     * 「被当众批评」会拿到「这么想自己的时候，心里是很闷的。」——共振错位。
     * 多样性不值得牺牲准确性：同一个痛点有 3 条句子轮换，已经够了。
     */
    const byPain = pain && PAIN_RESONATE[pain];
    if(byPain){
      lines.push(pick(byPain, 'v6res:' + pain));
    } else {
      lines.push(pick(RESONATE[emo.primary] || RESONATE.neutral, 'v4res:' + emo.primary));
    }
  } else if(strategy === 'hold'){
    lines.push(emo.intensity >= 6 ? strongerAck(emo) : pick(HOLD, 'v4hold'));
  }

  /* ⑥-C 第 2 句：验证
   * J3：原条件要求必须有 pain。但「烦死了」这类无痛点的愤怒
   *     会掉进 hold，回「不用急着把它说清楚」——用户不是说不清，是懒得细说。
   *     愤怒即使没有明确痛点，也必须被确认。
   */
  if(strategy === 'validate' || strategy === 'reflect'){
    if(pain && VALIDATE[pain]){
      lines.push(pick(VALIDATE[pain], 'v4val:' + pain));
    } else if(isAnger){
      lines.push(pick([
        '这事儿确实让人上火。',
        '烦是应该的，换谁都烦。',
        '听起来就一直没消停过。'
      ], 'v61anger'));
    }
  }

  /* ⑥-D 第 3 句：推论 —— witness 策略下不做推论 */
  if(strategy !== 'witness'){
    const carried = carriedLine(f);
    if(carried) lines.push(carried);
    lines.push(insightFor(pain, f, emo));
  }

  /* ⑥-E 跨轮洞察与记忆（任何一种策略下都可能出现，但会让位于前面几句） */
  const ci = crossInsight(f, emo);
  if(ci) lines.push(ci);

  const memLine = v3MemoryLine(mems, f);
  if(memLine) lines.push(memLine);

  /* ⑥-F 收尾：追问只在低中强度时出现。
   * 高强度（≥7）追问是冒犯；说不清的时候追问等于要求对方继续解释自己。 */
  let wantAsk = false, ask = null;
  if(strategy === 'chat' || (strategy === 'reflect' && emo.intensity < 7)){
    ask = v3Ask(f, emo, pain);
    wantAsk = !!ask && (strategy === 'chat' ? Math.random() < 0.55 : Math.random() < 0.45);
  }
  if(wantAsk){
    lines.push(ask);
    state.pendingAsk = ask;
    state.asked.push(ask);
    if(state.asked.length > 14) state.asked.shift();
  } else {
    state.pendingAsk = state.pendingAsk || null;
  }

  state.lastPain = pain;
  state.lastDiag = {
    pain, strategy,
    shape: strategy === 'witness' ? 'hold' : 'insight',
    cross: ci || '',
    insight: pain ? PAINNAME[pain] : '未归因',
    asked: wantAsk ? ask : null
  };

  /* ⑥-G 长度裁剪：情绪越重，话越少。
   * 这是一条反直觉但很重要的规则：人在最难受的时候读不进长句子。
   * witness 策略强制 ≤2 行，validate ≤3 行。 */
  // v4.1：验证型回复最多 2 句 —— 3 句就开始像讲课了。
  // 只有正常接话（chat）和中等强度（hold）才允许更长。
  const cap = (strategy === 'witness' || strategy === 'validate' || strategy === 'reflect') ? 2 : 3;
  const out = tighten(lines).slice(0, cap);
  return out.length ? out.join('\n\n') : pick(['我在。','嗯，我在听。'], 'v3empty');
}

/* =========================================================
   v1 生成：模板拼接（保留用于对比，展示迭代前后差异）
   ========================================================= */
const OPENERS = {
  sadness:['嗯。','听出来了。','这种感觉挺难熬的。'],
  anger:['换我我也气。','确实过分。'],
  anxiety:['悬着的感觉不好受。','在等结果的时候最难。'],
  loneliness:['我在。','我在这儿。'],
  tiredness:['累到说不出话的那种吧。','听着就累。'],
  shame:['那一瞬间挺难站的。'],
  numbness:['嗯。'],
  joy:['哦？','这个好。'],
  neutral:['嗯。']
};
const FOLLOWUPS = {
  work:['后来呢？','他具体说了什么？'],
  relationship:['然后呢？','他怎么说的？'],
  study:['卡在哪了？'],
  family:['他们怎么说的？'],
  daily_life:['然后呢？'],
  other:['具体是什么事？']
};
function v1Reply(text, presetMems){
  const emo = detectEmotion(text);
  const f   = analyze(text);
  if(MEDICAL.some(k => text.includes(k))){
    return '这个我判断不了，也不该由我判断。\n\n我能听你说现在的感觉。\n\n' +
           '如果你最近一直很难受，建议去正规医院的心理科看看，他们能给你靠谱的判断。需要的话我告诉你怎么挂号。';
  }
  if(DECISION.some(k => text.includes(k))){
    return '这个得你自己定，我可以帮你捋一捋。\n\n' + '如果不用管任何人的意见，你会怎么选？';
  }
  if(/记得|说过|以前|上次|提过/.test(text)){
    const mems = presetMems || retrieveMemory(text);
    if(!mems.length) return '这个我不太记得了。\n\n你再跟我说说？';
    return '记得，' + mems[0].content + '。' + (mems[0].time ? '你' + mems[0].time + '说的。' : '') + '\n\n怎么突然想起这个？';
  }
  if(/睡不着|失眠|熬夜/.test(text)){
    return '醒着就醒着吧。\n\n' + ['要听点什么吗？雨声或者白噪音。','我给你讲个没什么情节的故事？','要不就躺着，不用逼自己睡。'][state.turn % 3];
  }
  const op = OPENERS[emo.primary] || OPENERS.neutral;
  const tp = topicOf(text);
  const fu = FOLLOWUPS[tp] || FOLLOWUPS.other;
  let reply = op[state.turn % op.length];
  const mems2 = presetMems || retrieveMemory(text);
  if(mems2.length && Math.random() < 0.6){
    reply += '\n\n对了，' + mems2[0].content + '——' + (mems2[0].time ? '你' + mems2[0].time + '提过。' : '');
  }
  reply += '\n\n' + fu[state.turn % fu.length];
  // v1 会丢掉用户说的具体内容 —— 这正是它"笨"的地方
  void f;
  return reply;
}

/* 违法内容的统一拒答模板。纯模板，不经过任何生成路径。 */
const BLOCK_REPLY = '这个话题我不能参与。\n\n如果你想聊点别的，我在这儿。';

function generateReply(text, presetMems){
  /* SAFE_GUARD_V2 —— 最后一道闸（纵深防御）
   *
   * send() 已经在最前面做过分类和分流，按说这里用不着再判一次。
   * 但"能生成内容的函数"必须有自己的一道闸：评测脚本、单元测试、
   * 以后接的 HTTP 接口，任何一条路径都可能绕过 send()。
   * 安全不能依赖"调用方记得先分类"这个约定。
   *
   * 代价：每轮多一次字符串匹配，纳秒级，可以忽略。
   */
  const guard = classify(text);
  if(guard.risk === 'illegal') return BLOCK_REPLY;
  if(guard.risk === 'crisis')  return crisisReply(text);

  if(state.engine === 'v1') return v1Reply(text, presetMems);
  if(state.engine === 'v2') return v2Reply(text, presetMems);
  return v3Reply(text, presetMems);
}

/* ---------------- ⑦ 危机干预（固定四段结构） ---------------- */
function crisisReply(text){
  // 引用用户原话，而不是替用户下"你想消失"的结论——
  // 危机表达往往是隐晦的（如"想睡一个很长很长的觉"），写死措辞会对不上。
  const raw = (text || '').trim();
  const quote = raw.length > 22 ? raw.slice(0, 22) + '…' : raw;
  return (quote ? '你刚才说，「' + quote + '」。\n\n' : '') +
         '我不知道说什么能有用，但我想待在这儿听你说。\n\n' +
         '如果你现在很难受，可以打心理援助热线，24 小时都有人接，免费的，也不用说名字。\n' +
         '· 全国心理援助热线：12356\n' +
         '· 北京心理危机研究与干预中心：010-82951332\n' +
         '· 希望24热线：400-161-9995\n\n' +
         '能不能找一个人陪你待一会儿？朋友、家人都行。\n' +
         '一个人扛着太沉了。';
}

/* ---------------- ⑧ 记忆抽取 ---------------- */
/* 第三人称检测：判断这段文字讲的是不是"别人"。
   返回 true = 是别人 → 不该记成用户自己的状态。
   带"跟/和/与"时视为用户参与其中（"我跟我对象分手了"是用户自己的事）。

   注意单字亲属称谓也必须收录：空隙规则是 (.{0,3})，
   "我妈一个人住" 里只抓到 "妈" 一个字，若词表里只有"妈妈"就会漏判，
   结果把"我妈独居"记成"用户独居"——这是探针跑出来的第二个主体混淆。 */
const THIRD_PARTY = /朋友|闺蜜|哥们|室友|同事|同学|领导|老板|主管|爸爸|妈妈|父母|家人|姐姐|哥哥|妹妹|弟弟|对象|男朋友|女朋友|前任|老公|老婆|妈|爸|哥|姐|弟|妹|姨|叔|舅|婆|爷|奶|他|她/;
function thirdParty(gap){
  const g = String(gap || '');
  if(!THIRD_PARTY.test(g)) return false;
  return !/[跟和与]/.test(g);
}
/* 从整句中取第 i 个字符之后到片段结尾之间的空隙 */
function demoGap(input, start, whole){
  const idx = String(input).indexOf(whole);
  if(idx < 0) return '';
  return String(input).slice(idx + 1, idx + whole.length);
}

function extractMemory(text){
  const rules = [
    // 注意：中间的空隙必须惰性匹配（.{0,6}?），且「叫/名字是」不能是可选的。
    // 原来写 (.{{0,6}})(叫|名字是)? —— 贪婪的空隙会把名字吃掉，
    // \"我家那只猫叫橘子\" 被切成 \"叫橘\" + \"子\"，抽出来变成「养了一只猫，叫子」。
    // 这个缺陷是 tools/demo_sim_test.js 跑出来的。
    {re:/我(?:家)?(?:那只)?(猫|狗).{0,6}?(?:叫|名字是)([\u4e00-\u9fa5]{1,4})/,
     build:m=> thirdParty(demoGap(m.input, m.index + 1, m[0])) ? null :
               ({type:'person',content:'养了一只'+(m[1]==='猫'?'猫':'狗')+'，叫'+m[2],
                 entities:[m[2]], keywords:['养'+m[1], m[1], m[2]]})},
    {re:/(下周[一二三四五六日]|明天|后天)(.{0,10}?)(述职|面试|考试|答辩)/,
     build:m=>({type:'event',content:m[1]+'有'+m[3],entities:[m[3]],
                keywords:[m[3], m[1]+m[3]],time:m[1]})},
    // 主体校验：gap 里出现第三人称（朋友/闺蜜/我妈…）且没有"跟/和/与"，
    // 说明分手的是别人，不是用户 —— 不能记成用户自己的状态。
    {re:/我(.{0,4})(分手|失恋)了?/,
     build:m=> thirdParty(m[1]) ? null :
               ({type:'status',content:'最近刚经历分手',entities:['分手'],
                 keywords:['分手','失恋','前任'],emotion:'sadness'})},
    {re:/我(在|正在)?(考研|二战|备考)(.{0,4})?/,
     build:()=>({type:'status',content:'目前在备考/考研阶段',entities:['考研'],
                 keywords:['考研','备考','二战']})},
    {re:/我(.{0,3})(独居|一个人住)/,
     build:m=> thirdParty(m[1]) ? null :
               ({type:'status',content:'目前一个人住',entities:['独居'],
                 keywords:['独居','一个人住']})},
    // 主客体校验：只认「我 + 副词 + 讨厌/不喜欢 + 对象」。
    // 原来的 (.){0,2} 会让"我对象讨厌我"命中，记成"不喜欢我"——把谁讨厌谁弄反了。
    {re:/我(很|有点|特别|真|太|最|一直|挺)?(讨厌|不喜欢)([\u4e00-\u9fa5]{1,6})/,
     build:m=>({type:'preference',content:'不喜欢'+m[3],entities:[m[3]],
                keywords:[m[3],'不喜欢'+m[3]]})},
    // v2 新增：结构性事实抽取（要求有明确的状态标记，避免把随口一句都写进去）
    {re:/我(最近|这段时间|这一阵)(.{1,10}?)(睡不好|熬夜|失眠|加班|感冒|胃疼)/,
     build:m=>({type:'status',content:'最近'+m[3],entities:[m[3]],keywords:[m[3]]})},
    {re:/(我|向).{0,4}(提了离职|提离职|准备跳槽|打算离职)/,
     build:()=>({type:'event',content:'正在考虑离开当前公司',entities:['离职'],
                 keywords:['离职','跳槽','辞职']})},
    {re:/我(在|从事|做)?(互联网|金融|教育|医疗|设计|运营|销售|开发)(.{0,4})(行业|工作)?/,
     build:m=>({type:'profile',content:'从事'+m[2]+'相关工作',entities:[m[2]],
                keywords:[m[2], m[2]+'行业']})},
  ];
  const out = [];
  for(const r of rules){
    const m = text.match(r.re);
    if(!m) continue;
    const rec = r.build(m);
    if(!rec || !rec.content) continue;
    rec.id = 'm' + Date.now() + Math.floor(Math.random()*99);
    rec.emotion = rec.emotion || detectEmotion(text).primary;
    rec.importance = rec.importance || 3;
    rec.time = rec.time || '刚刚';
    rec.quote = text.slice(0, 40);
    // 去重
    if(!state.memories.some(x => x.content === rec.content)) out.push(rec);
  }
  return out.slice(0, 2);
}

/* ---------------- ⑨ 输出复检 ---------------- */
const FORBIDDEN = ['你已经很棒','一切都会好起来','要相信自己','你应该','我建议你','你可以尝试',
                   '感谢您的分享','希望我的回答','总之','加油！','想开点','别想太多','作为AI','我是AI'];
function checkReply(r){
  const hits = FORBIDDEN.filter(x => r.includes(x));
  const lines = r.split('\n').filter(l => l.trim());
  const tooLong = lines.some(l => l.length > 60);
  return {safe: hits.length === 0, violations: hits, lengthOk: !tooLong};
}

/* ---------------- 渲染 ---------------- */
function addMsg(who, text, tags){
  const row = document.createElement('div');
  row.className = 'row' + (who === 'me' ? ' me' : '');
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = who === 'me' ? '🙂' : '🌊';
  const box = document.createElement('div');
  const bub = document.createElement('div');
  bub.className = 'bub';
  bub.textContent = text;
  box.appendChild(bub);
  if(tags && tags.length){
    const meta = document.createElement('div');
    meta.className = 'meta';
    tags.forEach(t => {
      const s = document.createElement('span');
      s.className = 'tag' + (t.cls ? ' ' + t.cls : '');
      s.textContent = t.text;
      meta.appendChild(s);
    });
    box.appendChild(meta);
  }
  row.appendChild(av); row.appendChild(box);
  el('msgs').appendChild(row);
  el('msgs').scrollTop = el('msgs').scrollHeight;
}

/* 「本轮理解」面板：把"它在想什么"摊开给面试官看 */
function renderUnderstand(f, emo, intent, mems, ctx){
  const box = el('understand');

  const row = (k, v) => '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';

  html += row('角色', f.people.length ? chips(f.people) : '—');
  html += row('事件', f.events.length ? chips(f.events) : '—');
  html += row('情绪', '<i>' + EMONAME[emo.primary] + ' ' + emo.intensity + '/10</i>' +
              (emo.trigger ? ' ← 命中「' + esc(emo.trigger) + '」' : ''));
  html += row('意图', intent);
  html += row('回扣点', '「' + esc(f.phrase || '') + '」');
  if(ctx.samePerson) html += row('跨轮', '本轮再次出现：' + esc(ctx.samePerson.word) + '（上轮提到过）');
  html += row('记忆', mems.length ? ('命中 ' + mems.length + ' 条') : '未命中');
  let plan;
  if(state.engine === 'v3' && state.lastDiag){
    const d = state.lastDiag;
    const STRAT = {
      witness:  '见证（只陪，不分析）',
      validate: '验证（先确认你这样正常）',
      reflect:  '验证 + 推论',
      hold:     '接住（说不清时）',
      chat:     '正常接话'
    };
    html += row('归因', '<i>' + esc(d.pain ? PAINNAME[d.pain] : '未归因') + '</i>');
    html += row('策略', '<i>' + esc(STRAT[d.strategy] || d.strategy || '—') + '</i>');
    html += row('收尾', d.asked ? '问一个信息缺口' : '本轮不追问');
    plan = ['① 选策略：' + (STRAT[d.strategy] || '正常接话'),
            '② 共振：让对方先感到"你懂"',
            d.pain ? '③ 验证：你的反应是合理的' : '③ 不验证，先接住内容',
            d.cross ? '④ 跨轮点破：' + d.cross : '④ 推论 / 追问'];
  } else {
    plan = ['① 先接住情绪，不评价',
            '② 复述' + (f.phrase ? '具体细节「' + f.phrase + '」' : '内容') + '，证明在听',
            '③ 针对' + (f.people.length ? '「' + f.people[0].word + '」' : '事件') + '追问一个问题'];
  }
  html += '<div class="plan">' + plan.map(esc).join('<br>') + '</div>';
  box.innerHTML = html;
}

/* 对话脉络：最近几轮的话题 / 情绪曲线 */
function renderFlow(){
  const box = el('flow');
  if(state.log.length < 2){ box.innerHTML = '<div class="empty">连续对话 ≥2 轮后出现</div>'; return; }
  box.innerHTML = state.log.slice(-4).map((r, i) =>
    '<div class="flow-item">#' + (state.log.length - state.log.slice(-4).length + i + 1) + ' ' +
    '<b>' + esc(EMONAME[r.emotion] || r.emotion) + '</b> · ' + esc(r.topic) +
    (r.people.length ? ' · ' + esc(r.people.map(p => p.word).join('/')) : '') + '</div>'
  ).join('') + '<div class="hint">用于在后续轮次里做上下文呼应，例如"又是他"。</div>';
}

function renderMem(){
  const box = el('memList');
  if(!state.memories.length){ box.innerHTML = '<div class="empty">暂无记忆</div>'; return; }
  box.innerHTML = '';
  state.memories.forEach(m => {
    const d = document.createElement('div');
    d.className = 'mem-item';
    d.innerHTML = '<div class="t">[' + esc(m.type) + '] ' + esc(m.content) + '</div>' +
                  '<div class="q">“' + esc(m.quote || '') + '” · ' + esc(m.time || '') + '</div>' +
                  '<div class="star">' + '★'.repeat(m.importance || 1) + '</div>';
    box.appendChild(d);
  });
  el('s2').textContent = state.memories.length;
}

function updateStats(){
  el('s1').textContent = state.turn;
  el('s3').textContent = state.hits;
  el('s4').textContent = state.blocks;
  el('s5').textContent = '¥' + state.cost.toFixed(5);
  el('turnBadge').textContent = '第 ' + state.turn + ' 轮';
}

/* ---------------- 引擎切换 ---------------- */
const ENGINE_NAME = {v1:'v1 模板引擎', v2:'v2 理解引擎', v3:'v3 归因引擎'};
function setEngine(v){
  state.engine = v;
  el('engV1').className = (v === 'v1' ? 'on' : '');
  el('engV2').className = (v === 'v2' ? 'on' : '');
  el('engV3').className = (v === 'v3' ? 'on' : '');
  addMsg('ai', v === 'v1'
    ? '已切到 v1 模板拼接引擎。\n\n（回复按轮次套模板，不看你具体说了什么——这是最开始的样子。）'
    : v === 'v2'
    ? '已切到 v2 理解引擎。\n\n（抽出你话里的人/事/情绪，回扣细节、按对象追问。但它每轮都是同一个三段式。）'
    : '已切到 v3 归因引擎。\n\n（先判断这件事伤在哪里，再说出你自己没说出口的那层；按情况决定回几句、问不问。）');
}

/* ---------------- 主流程 ---------------- */
let busy = false;
function send(){
  if(busy) return;
  const inp = el('inp');
  const text = (inp.value || '').trim();
  if(!text) return;
  inp.value = '';
  busy = true;

  addMsg('me', text);
  const steps = [];
  const push = (n,v,k) => { steps.push({n,v,k:k||''}); renderTrace(steps); };

  push('① 开始', 'user_input=' + text.slice(0,18) + (text.length>18?'…':''));

  setTimeout(() => {
    // ② 硬规则
    const hard = CRISIS.some(k => text.includes(k)) || ILLEGAL.some(k => text.includes(k));
    push('② 硬规则过滤', hard ? 'hard_hit=true ⚠' : 'hard_hit=false', hard?'warn':'ok');

    setTimeout(() => {
      // ③ 安全分类
      const c = classify(text);
      push('③ 安全分类', 'risk=' + c.risk + ' / ' + c.cat,
           c.risk==='normal'?'ok':(c.risk==='concern'?'warn':'danger'));

      setTimeout(() => {
        // ④ 分支路由
        push('④ 条件分支', 'route → ' + (c.risk==='normal'?'⑥ 情绪识别':
             (c.risk==='concern'?'⑥ 情绪识别(concern)':'⑤A 危机干预')),
             c.risk==='normal'?'ok':'danger');

        setTimeout(() => {
          let reply = '';

          if(c.risk === 'crisis'){
            reply = crisisReply(text);
            state.blocks++;
            push('⑤A 危机干预', '固定四段结构 + 热线资源', 'danger');
            push('⑤B 告警', '已记录日志并通知值班人员', 'warn');
            finishTurn(text, reply, [], analyze(text), detectEmotion(text), 'crisis_intervention', []);
          } else if(c.risk === 'illegal'){
            reply = BLOCK_REPLY;
            state.blocks++;
            push('⑤C 硬拦截', '返回固定拒答模板', 'danger');
            finishTurn(text, reply, [], analyze(text), detectEmotion(text), 'blocked', []);
          } else {
            // ⑥ 情绪识别
            const emo = detectEmotion(text);
            const intent = detectIntent(text);
            const f = analyze(text);
            push('⑥ 情绪识别', 'emotion=' + EMONAME[emo.primary] +
                 ' / 强度 ' + emo.intensity + ' / intent=' + intent, 'ok');

            setTimeout(() => {
              // ⑦ 实体抽取（v2） / 结构归因（v3）
              if(state.engine === 'v2'){
                push('⑦ 实体抽取', 'who=' + (f.people.map(p=>p.word).join('/')||'—') +
                     ' / event=' + (f.events.map(e=>e.word).join('/')||'—') +
                     ' / 回扣「' + f.phrase + '」', 'ok');
              } else if(state.engine === 'v3'){
                const fr   = readFrame(text);
                const pain = attributePain(fr, emo);
                push('⑦ 结构归因', 'pain=' + (pain ? PAINNAME[pain] : '未归因') +
                     ' / 付出=' + (fr.effort ? '有' : '无') +
                     ' / 否定=' + (fr.denial ? '有' : '无') +
                     ' / 当众=' + (fr.pub ? '有' : '无') +
                     ' / 脉络=' + state.log.length + '轮', 'ok');
              } else {
                push('⑦ 实体抽取', 'v1 跳过此节点（直接用模板）', '');
              }

              setTimeout(() => {
                // ⑧ 记忆检索
                const mems = retrieveMemory(text);
                push('⑧ 记忆检索', mems.length ?
                     ('命中 ' + mems.length + ' 条：' + mems[0].content) :
                     ('未命中（阈值 ' + MEM_THRESHOLD + '）'), mems.length?'ok':'');

                setTimeout(() => {
                  const ctx = contextHint(f);
                  push('⑨ 上下文组装', state.engine === 'v3'
                       ? ('persona + 归因表 + memory + summary（≈2040 token）')
                       : (state.engine === 'v2' && ctx.note
                          ? ('persona + memory + summary + 跨轮线索「' + ctx.note + '」')
                          : 'persona + memory + summary（≈1660 token）'), 'ok');

                  setTimeout(() => {
                    reply = generateReply(text, mems);
                    push('⑩ 主回复生成', (ENGINE_NAME[state.engine] || state.engine) +
                         ' / temp=0.8 / 输出 ' + reply.split('\n').filter(s=>s.trim()).length +
                         ' 句 / ' + reply.length + ' 字', 'ok');

                    setTimeout(() => {
                      const chk = checkReply(reply);
                      push('⑪ 输出复检', chk.safe ?
                           ('通过 · 禁用词 0 · 长度合规') :
                           ('命中禁止项：' + chk.violations.join('、')),
                           chk.safe?'ok':'danger');

                      setTimeout(() => {
                        finishTurn(text, reply, mems, f, emo, intent, [], {ctx, steps: null, intent, f, emo, mems});
                      }, 380);
                    }, 320);
                  }, 420);
                }, 300);
              }, 280);
            }, 260);
          }
        }, 300);
      }, 280);
    }, 260);
  }, 240);

  /* 收尾：渲染回复 + 记忆写入 + 脉络更新 */
  function finishTurn(text, reply, mems, f, emo, intent, tags, extra){
    const ctx = (extra && extra.ctx) || {note:null, samePerson:null};
    addMsg('ai', reply, [{text:(ENGINE_NAME[state.engine] || state.engine),
                          cls: state.engine === 'v1' ? 'v1' : ''}]
           .concat(tags || []));
    if(state.engine !== 'v1') renderUnderstand(f, emo, intent, mems, ctx);

    const added = extractMemory(text);
    if(added.length){
      state.memories.push(...added);
      renderMem();
      push('⑫ 记忆写入', '新增 ' + added.length + ' 条：' + added.map(a => a.content).join(' / '), 'ok');
    } else {
      push('⑫ 记忆写入', '无可写入信息', '');
    }

    // 写入对话脉络（供下一轮做跨轮呼应）
    state.log.push({
      text: text.slice(0, 30),
      emotion: emo.primary,
      intensity: emo.intensity,
      topic: topicOf(text),
      people: f.people,
      events: f.events
    });
    if(state.log.length > 12) state.log.shift();
    renderFlow();

    state.turn++;
    // 单轮成本口径与 docs/02 §3.2 一致：2040 in × ¥2/M + 200 out × ¥8/M = ¥0.00568
    state.cost += 0.00568;
    updateStats();
    busy = false;
  }
}

function quick(t){
  el('inp').value = t;
  send();
}

/* 移动端抽屉：窄屏时侧栏（本轮理解 / 执行轨迹 / 记忆库）收进抽屉，
   点右上角 ☰ 滑出。桌面上按钮不显示，侧栏常驻。 */
function toggleDrawer(open){
  const side = document.querySelector('.side');
  const mask = el('drawerMask');
  if(!side) return;
  side.classList.toggle('open', !!open);
  if(mask) mask.classList.toggle('on', !!open);
  // 抽屉打开时锁住页面滚动，避免背景跟着动
  document.body.style.overflow = open ? 'hidden' : '';
}

/* =========================================================
   v5 · 夜间仪式：开场与告别
   ---------------------------------------------------------
   参考 Coffee Talk / VA-11 HALL-A 这类"酒吧叙事"游戏的做法：
   玩家走进店里，不会被告知"你可以咨询什么"，而是被当成一个
   来坐坐的人。开场白的功能是让人有**到了**的感觉。

   原开场："还没睡？不想聊什么也没关系，我在这儿。"
   问题：它假设用户是"睡不着才来的"，把人框进失眠场景。

   新开场：按时段给不同的话，像一个真的开着门的店。
   ========================================================= */

function nightGreeting(hour){
  const h = (typeof hour === 'number' && isFinite(hour)) ? hour : new Date().getHours();
  if(h >= 22 || h < 1) return '来了。\n\n今晚想坐会儿吗？';
  if(h >= 1 && h < 4)  return '这么晚还醒着。\n\n坐吧，不着急说话。';
  if(h >= 4 && h < 7)  return '天快亮了。\n\n你就这么醒了一夜？';
  if(h >= 7 && h < 12) return '早上。\n\n昨晚睡得怎么样？';
  if(h >= 12 && h < 18) return '下午好。\n\n怎么这个点过来了？';
  return '晚上好。\n\n今天还顺利吗？';
}

/* ---------------- 初始提示 ---------------- */
window.onload = function(){
  renderMem();
  updateStats();
  setTimeout(() => {
    addMsg('ai', nightGreeting());
  }, 600);
};
</script>
