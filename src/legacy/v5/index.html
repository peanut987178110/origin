<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0a18">
<title>Tide</title>
<style>
:root{
  --bg:#0b0a18; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.11); --txt:#eae8f6; --dim:#928dae;
  --accent:#8b7cf6; --accent2:#5eead4; --warn:#fbbf24; --danger:#f87171; --ok:#4ade80; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 20% -10%,#241d55 0%,transparent 62%),
  radial-gradient(700px 500px at 100% 100%,#123245 0%,transparent 58%),var(--bg);
  color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
@supports(height:100dvh){body{height:100dvh}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.pad{padding:22px;padding-top:calc(22px + env(safe-area-inset-top));padding-bottom:calc(22px + env(safe-area-inset-bottom));overflow-y:auto;flex:1}
h1{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.3}
h2{font-size:17px;font-weight:650;margin-bottom:4px}
.sub{font-size:13.5px;color:var(--dim);line-height:1.7;margin-top:6px}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),#6d5ce7);color:#fff;cursor:pointer}
.btn:active{opacity:.82}.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
.btn.sm{padding:10px;font-size:13px;border-radius:11px}
input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;color:var(--txt);font-size:15px;outline:none;font-family:inherit}
.hint{font-size:12px;color:var(--dim);line-height:1.7;margin-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:10px;align-items:center}
.notice{background:rgba(139,124,246,.12);border:1px solid rgba(139,124,246,.35);color:#d9d3fd;
  border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin:10px 14px 0}
.warnbox{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:#fde3a0;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.choice{border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:10px;background:var(--panel);font-size:15px}
.choice:active,.choice.on{border-color:rgba(139,124,246,.7);background:rgba(139,124,246,.14)}
.big{width:64px;height:64px;border-radius:50%;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  background:linear-gradient(135deg,rgba(139,124,246,.35),rgba(94,234,212,.28))}
.top{display:flex;align-items:center;gap:11px;flex:none;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:rgba(11,10,24,.72)}
.ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;
  background:linear-gradient(135deg,rgba(139,124,246,.35),rgba(94,234,212,.28))}
.top .nm{font-size:15px;font-weight:600}.top .st{font-size:11.5px;color:var(--dim);margin-top:1px}
.iconbtn{width:40px;height:40px;border-radius:11px;flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:17px}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:30px;height:30px;font-size:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:linear-gradient(135deg,rgba(139,124,246,.35),rgba(94,234,212,.28))}
.msg.me .av{background:linear-gradient(135deg,#f472b6,#fb923c)}
.bub{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:11px 14px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-width:80%}
.msg.me .bub{background:rgba(139,124,246,.2);border-color:rgba(139,124,246,.4)}
.bub.err{border-color:rgba(248,113,113,.4);color:#f5b3b3;font-size:13.5px}
.bub.crisis{border-color:rgba(251,191,36,.5)}
.sys{text-align:center;font-size:11.5px;color:var(--dim);padding:4px}
.inputbar{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(11,10,24,.8)}
.inputbar textarea{flex:1;resize:none;min-height:44px;max-height:120px;padding:11px 14px;font-size:16px;border-radius:22px;line-height:1.5}
.send{width:46px;height:46px;border-radius:50%;border:none;flex:none;font-size:19px;background:linear-gradient(135deg,var(--accent),#6d5ce7);color:#fff}
.send:disabled{opacity:.35}
.mic{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.mic.rec{background:rgba(248,113,113,.22);border-color:var(--danger)}
.sheet{position:fixed;inset:0;z-index:80;display:none}.sheet.on{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet .body{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:#141230;border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.divider{height:1px;background:var(--line);margin:18px 0}
.plan{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.plan.best{border-color:rgba(139,124,246,.7);background:rgba(139,124,246,.1)}
.mem{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.tag{font-size:11px;color:var(--accent2)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);margin:0 2px;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.22}30%{opacity:1}}
</style>
</head>
<body>

<!-- 1. 年龄与 AI 身份（加州 SB 243 / 纽约 GBS §1700） -->
<section class="screen on" id="s-gate">
  <div class="pad" style="display:flex;flex-direction:column;justify-content:center">
    <div class="big">🌊</div>
    <h1 style="text-align:center" data-i18n="gateTitle"></h1>
    <div class="sub" style="text-align:center" data-i18n="gateSub"></div>
    <div class="card" style="margin-top:22px">
      <div class="warnbox" data-i18n="gateAi"></div>
      <div class="hint" data-i18n="gateMinor"></div>
      <button class="btn" style="margin-top:14px" id="btnAge" onclick="confirmAge()" data-i18n="gateYes"></button>
      <button class="btn ghost sm" style="margin-top:8px" onclick="underAge()" data-i18n="gateNo"></button>
      <div id="gateMsg" class="hint"></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:16px">
      <button class="btn ghost sm" style="width:auto" onclick="setLang('en')">English</button>
      <button class="btn ghost sm" style="width:auto" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</section>

<!-- 2. 新手引导：一个问题 → 推荐一个角色 -->
<section class="screen" id="s-onboard">
  <div class="pad">
    <h1 data-i18n="onbTitle"></h1>
    <div class="sub" data-i18n="onbSub"></div>
    <div id="onbChoices" style="margin-top:18px"></div>
  </div>
</section>

<section class="screen" id="s-match">
  <div class="pad" style="display:flex;flex-direction:column;justify-content:center">
    <div class="big" id="matchAva">🌊</div>
    <h1 style="text-align:center" id="matchName"></h1>
    <div class="sub" style="text-align:center" id="matchDesc"></div>
    <button class="btn" style="margin-top:24px" onclick="startWithMatch()" data-i18n="matchGo"></button>
    <button class="btn ghost sm" style="margin-top:10px" onclick="showAllPersonas()" data-i18n="matchOther"></button>
    <div id="matchAll" style="margin-top:14px"></div>
  </div>
</section>

<!-- 3. 聊天 -->
<section class="screen" id="s-chat">
  <div class="top">
    <div class="ava" id="chatAva">🌊</div>
    <div style="flex:1;min-width:0">
      <div class="nm" id="chatName">Tide</div>
      <div class="st" id="chatStatus">—</div>
    </div>
    <button class="iconbtn" onclick="openSheet('memory')">📖</button>
    <button class="iconbtn" onclick="openSheet('settings')">⚙</button>
  </div>
  <div id="aiNotice" class="notice" style="display:none"></div>
  <div id="msgs"></div>
  <div class="inputbar">
    <button class="send mic" id="micBtn" onclick="toggleMic()">🎙</button>
    <textarea id="inp" rows="1" oninput="autoGrow(this)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
    <button class="send" id="sendBtn" onclick="sendMsg()">↑</button>
  </div>
</section>

<!-- 底部抽屉：设置 / 记忆 / 付费墙 共用 -->
<div class="sheet" id="sheet">
  <div class="mask" onclick="closeSheet()"></div>
  <div class="body" id="sheetBody"></div>
</div>

<script>/*__TIDE_CORE__*/</script>
<script>/*__TIDE_MARKET__*/</script>
<script>
/*__TIDE_APP__*/
</script>
</body>
</html>
