<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0b16">
<title>Orbit</title>
<style>
:root{
  --bg:#0a0b16; --bg2:#11132a; --card:#161935; --card2:#1d2145; --line:rgba(255,255,255,.09);
  --txt:#eceefa; --dim:#9aa0c3; --faint:#6b7199; --acc:#a78bfa; --acc2:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --r:18px; --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(700px 480px at 85% -10%,rgba(167,139,250,.16),transparent 65%),
  radial-gradient(600px 420px at -10% 110%,rgba(96,165,250,.12),transparent 60%),var(--bg)}
/* screens: only the active one is displayed; entering screen fades/slides 150 ms (transform only) */
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex;animation:in .15s ease-out}
.scr.on.back{animation:inb .15s ease-out}
@keyframes in{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:.4;transform:translateX(-18px)}to{opacity:1;transform:none}}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px calc(24px + var(--safe-b))}
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(10,11,22,.86)}
.top h2{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:17px;font-weight:650}
.top .pill{margin-left:auto} /* a long title on a phone-width bar drops the pill to a second line instead of clipping it */
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card);border:1px solid var(--line)}
.ib:active,.btn:active,.opt:active,.chip:active,.row.tap:active{transform:scale(.97);opacity:.85}
h1{font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:14px;margin-top:8px}
.tiny{font-size:12px;color:var(--faint)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:600;font-size:15px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0b18;transition:transform .08s}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px;width:auto}
.btn.danger{background:rgba(248,113,113,.14);color:#fca5a5;border:1px solid rgba(248,113,113,.3)}
.btn[disabled]{opacity:.4;pointer-events:none}
.stack>*+*{margin-top:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);transition:transform .08s}
.opt.on{border-color:var(--acc);background:var(--card2)}
.opt .t{font-weight:600}.opt .d{font-size:13px;color:var(--dim);margin-top:2px}
.orb{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;
  background:radial-gradient(circle at 30% 30%,var(--c1,#a78bfa),var(--c2,#60a5fa));box-shadow:0 0 24px -6px var(--c1,#a78bfa)}
.orb.big{width:88px;height:88px;font-size:42px}.orb.s{width:32px;height:32px;font-size:16px;box-shadow:none}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}.row .grow{flex:1;min-width:0}.row .k{font-weight:550}.row .v{color:var(--dim);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:8px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px}
.seg button.on{background:var(--acc);color:#0b0b18;border-color:transparent;font-weight:600}
.sw{width:46px;height:28px;border-radius:99px;background:#2a2f55;position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
input.f,textarea.f{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13.5px}
.chip.x::after{content:' ×';color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;background:var(--bg2);border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
.bar{height:6px;border-radius:9px;background:#252a52;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
/* bottom tabs */
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:rgba(10,11,22,.94);padding-bottom:var(--safe-b)}
.tabs button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:19px;font-weight:400}.tabs button.on{color:var(--txt)}
/* chat */
#msgs{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.m{display:flex;gap:8px;max-width:100%}.m.me{flex-direction:row-reverse}
.bub{max-width:82%;padding:10px 13px;border-radius:18px;background:var(--card2);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.m.me .bub{background:linear-gradient(135deg,rgba(167,139,250,.32),rgba(96,165,250,.26));border-color:rgba(167,139,250,.35);border-bottom-right-radius:6px}
.m.ai .bub{border-bottom-left-radius:6px}
.bub.crisis{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.08)}
.bub.pro{border-style:dashed}
.bub .cur{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--dim);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.meta{display:flex;gap:4px;margin:4px 0 0 40px;flex-wrap:wrap}
.meta button{font-size:12px;color:var(--faint);padding:3px 7px;border-radius:8px}
.meta button.on{color:var(--acc)}
.sysl{align-self:center;font-size:12px;color:var(--faint);padding:2px 10px;text-align:center}
.mc{align-self:stretch;margin-left:40px;background:var(--card);border:1px solid rgba(167,139,250,.35);border-radius:16px;padding:12px}
.mc .q{font-size:14px}.mc .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qr{flex:none;display:flex;gap:8px;overflow-x:auto;padding:4px 12px 6px}.qr .chip{white-space:nowrap}
.inp{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + var(--safe-b));border-top:1px solid var(--line);background:rgba(10,11,22,.94)}
.inp textarea{flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 14px;border-radius:21px;background:var(--bg2);border:1px solid var(--line);outline:none;line-height:1.45}
.send{width:42px;height:42px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0b18}
.send.stop{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.ib.rec{background:rgba(248,113,113,.2);border-color:var(--bad)}
.ready{flex:none;font-size:12px;color:var(--dim);padding:6px 14px;background:rgba(167,139,250,.08);border-bottom:1px solid var(--line);display:none}
.ready.on{display:block}
/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:50;display:none}.sheet.on{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:18px 18px calc(18px + var(--safe-b));animation:up .16s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);z-index:60;background:#262b55;border:1px solid var(--line);
  padding:9px 14px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .15s;max-width:86%;text-align:center}
#toast.on{opacity:1}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi .card{padding:11px}.kpi .n{font-size:20px;font-weight:700}.kpi .l{font-size:12px;color:var(--dim)}
.kpi .t{font-size:11px;color:var(--faint)}
.wm{font-size:11px;letter-spacing:.06em;color:var(--warn);border:1px dashed rgba(251,191,36,.5);border-radius:8px;padding:4px 8px;display:inline-block}
mark{background:rgba(251,191,36,.35);color:inherit;border-radius:3px}
/* v6.1 · claw cabinet. The targets and the claw are placed with percentages of the
   cabinet box, so tapping anywhere and the judged 0–1000 coordinates agree. */
.booth{position:relative;flex:none;height:min(46vh,340px);min-height:280px;border-radius:18px;overflow:hidden;touch-action:none;
  background:linear-gradient(180deg,rgba(96,165,250,.10),rgba(167,139,250,.06)),var(--bg2);border:1px solid var(--line)}
.booth::after{content:'';position:absolute;left:0;right:0;bottom:26%;border-top:1px dashed rgba(255,255,255,.10)}
.booth .tg{pointer-events:none;position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:14px;font-size:27px;line-height:44px;text-align:center;
  background:var(--card2);border:1.5px solid var(--line);transition:transform .08s}
.booth .tg.sel{border-color:var(--acc);box-shadow:0 0 0 4px rgba(167,139,250,.18);transform:scale(1.06)}
.booth .tg.taken{opacity:.5;border-color:rgba(74,222,128,.5);color:var(--ok)}
.booth.done .tg{opacity:.55}
.booth .claw{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;font-size:22px;text-align:center;line-height:30px;pointer-events:none;
  color:#0b0b18;background:var(--acc);border-radius:50%;box-shadow:0 0 0 6px rgba(167,139,250,.16)}
.btn.disabled{opacity:.4}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="mask" data-act="sheet.close"></div><div class="pane" id="pane"></div></div>
<div id="toast"></div>
<script>/*__ORBIT_JS__*/</script>
</body>
</html>
